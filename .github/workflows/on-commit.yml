name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: self-hosted
    container: node:18-bullseye
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Manage Dependencies
        run: npm ci
      - name: Running Tests
        run: npm run test:lib:ci
      - name: Running build
        run: npm run build:lib:prod
