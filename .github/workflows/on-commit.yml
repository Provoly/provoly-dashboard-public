name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: provoly-runner
    container: "${{ vars.REGISTRY_URL }}/docker-mirror/library/node:18-bullseye"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Manage Dependencies
        run: npm ci
      - name: Running Tests
        run: npm run test:lib:ci
      - name: Running build
        run: npm run build:lib:prod
