name: Tests

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: provoly-runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Manage Dependencies
        run: npm ci
      - name: Running Tests
        run: npm run test:lib:ci
      - name: Running build
        run: npm run build:lib:prod
