name: Sonar

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

jobs:
  sonar:
    runs-on: provoly-runner
    container: "${{ vars.REGISTRY_URL }}/docker-mirror/sonarsource/sonar-scanner-cli"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Export sonar URL
        run: export SONAR_HOST_URL=$SONAR_URL
      - name: Running Tests & coverage
        run: npm run test:lib:coverage:ci
      - name: Analysis
        run: sonar-scanner -Dsonar.login=$SONAR_ADMIN_TOKEN
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/**
