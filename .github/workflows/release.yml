name: Release

on:
  push:
    tags:
      - '**'

jobs:
  release:
    runs-on: self-hosted
    container: node:18-bullseye
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set repository
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Manage Dependencies
        run: npm ci
      - name: Prepare release
        run: npm version ${{ github.ref_name }} --no-git-tag-version --no-commit-hooks --allow-same-version -w projects/provoly/dashboard
      - name: Building release
        run: npm run build:lib:prod
      - name: Building Schematics
        run: cd projects/provoly/dashboard/ ; npm run build ; cd ../../..
      - name: Publishing
        run: npm run pub
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}


