<div class="o-edit-named-query">
  @if (currentEditType$ | async; as currentEditType) {
    <div class="o-edit-named-query__content">
      @switch (currentEditType) {
        @case (FULL_TEXT) {
          <pry-search-fulltext
            mode="vertical"
            [launchButton]="false"
            (searchChange)="onSearchFulltextChange($event)"
            [currentEdit]="currentEdit$ | async"
          ></pry-search-fulltext>
        }
        @case (MONO_CLASS) {
          <pry-search-mono-class></pry-search-mono-class>
        }
        @case (MULTI_CLASS) {
          <pry-search-multi-class></pry-search-multi-class>
        }
      }
    </div>
    <div class="o-edit-named-query__buttons">
      @if (currentEditType !== FULL_TEXT) {
        <pry-choose-widget (selected)="select($event)"></pry-choose-widget>
      }
      <div class="m-btn-group">
        @if (currentEditType === FULL_TEXT) {
          <button type="button" class="a-btn a-btn--primary" (click)="cancel()">
            {{ '@pry.search.button.cancel' | i18n }}
          </button>
        }
        <button
          [disabled]="
            (currentEditType === MULTI_CLASS && !(searchMultiClassValid$ | async)) ||
            (currentEditType === MONO_CLASS && !(searchMonoClassValid$ | async)) ||
            !(currentEdit$ | async)?.owner
          "
          type="button"
          class="a-btn a-btn--primary a-btn--icon-text"
          (click)="search()"
          >
          <pry-icon iconSvg="search-line"></pry-icon>
          {{
          ((currentEdit$ | async)?.id === DEFAULT_NAMED_QUERY_ID
          ? '@pry.search.button.search'
          : '@pry.search.button.update'
          ) | i18n
          }}
        </button>
      </div>
    </div>
  }
</div>
