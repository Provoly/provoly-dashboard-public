<ng-container *ngIf="condition$ | async as condition">
  <div class="o-multi-class-condition">
    <div class="o-multi-class-condition__content">
      <div class="o-multi-class-condition__content__action">
        <button
          type="button"
          class="a-btn a-btn--primary -size-sm -width-full"
          aria-label="selection button"
          (click)="toggleFieldSelection()"
        >
          <ng-container *ngIf="field$ | async as field; else noFieldTpl">
            {{ field.name }}
          </ng-container>
          <ng-template #noFieldTpl>{{ '@pry.search.multi.selectField' | i18n }}</ng-template>
        </button>

        <ng-container *ngIf="classesLinked$ | async as classesLinked">
          <pry-icon
            iconSvg="links_line"
            [width]="15"
            [height]="15"
            style="color: black"
            [attr.data-tooltip]="('@pry.search.multi.in' | i18n) + ' ' + join(classesLinked)"
          ></pry-icon>
        </ng-container>
      </div>

      <ng-container [formGroup]="form">
        <div class="m-form-label-field">
          <pry-select
            [items]="operators$ | async"
            placeholder="Opérateur"
            formControlName="operator"
            [itemsAsOption]="true"
            [labelTranslate]="true"
            bindValue="operator"
            bindLabel="translation"
            class="a-pry-select"
          ></pry-select>
        </div>
        <div class="m-form-label-field">
          <ng-container *ngIf="condition.isDate; else classicInput">
            <pry-date-picker
              formControlName="value"
              (click)="onUpdateValue(condition)"
              [rangePicker]="hasTwoFields"
              [roundSelection]="true"
              [timePicker]="true"
            ></pry-date-picker>
          </ng-container>
          <ng-template #classicInput>
            <input
              type="text"
              class="a-form-field"
              [placeholder]="
                (hasTwoFields ? '@pry.search.placeholder.minValue' : '@pry.search.placeholder.search') | i18n
              "
              formControlName="value"
              (focusout)="onUpdateValue(condition)"
            />
            <ng-container *ngIf="hasTwoFields">
              <input
                type="text"
                class="a-form-field"
                [placeholder]="'@pry.search.placeholder.maxValue' | i18n"
                formControlName="upperValue"
                (focusout)="onUpdateValue(condition)"
              />
            </ng-container>
          </ng-template>

          <label class="a-label a-label--help -error" *ngIf="formValue?.errors?.['required'] && formValue?.touched">
            {{ '@pry.search.multi.requiredError' | i18n }}
          </label>
        </div>
      </ng-container>
    </div>

    <div class="o-multi-class-condition__delete-content">
      <ng-container *ngIf="notLastCondition$ | async; else cannotDelete">
        <button type="button" class="a-btn a-btn--icon-only">
          <pry-icon
            iconSvg="delete"
            [height]="20"
            [width]="20"
            [animation]="false"
            (click)="onRemoveCondition(condition)"
          ></pry-icon>
          <span class="u-visually-hidden">{{ '@pry.action.delete' | i18n }}</span>
        </button>
      </ng-container>
    </div>
    <ng-template #cannotDelete>
      <button type="button" class="a-btn a-btn--icon-only" disabled>
        <pry-icon [height]="20" [width]="20" iconSvg="delete"></pry-icon>
        <span class="u-visually-hidden">{{ '@pry.action.delete' | i18n }}</span>
      </button>
    </ng-template>
  </div>

  <ng-template #fieldSelectionTpl>
    <pry-multi-class-field-selection
      [conditionId]="condition.id"
      (closeModal)="onCloseModal()"
      (selectFieldChange)="onChangeField(condition, $event)"
    ></pry-multi-class-field-selection>
  </ng-template>
</ng-container>
