@if (_attributes$ | async; as attributes) {
  <ul class="m-pry-search-select-attribute">
    @for (attr of attributes; track attr) {
      <li class="m-pry-search-select-attribute__item">
        <button class="a-btn" (click)="onSelectAttribute(attr)">
          {{ attr.name }}
        </button>
      </li>
    }
  </ul>
}
