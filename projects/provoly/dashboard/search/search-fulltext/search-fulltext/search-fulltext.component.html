<pry-search-css></pry-search-css>
<div class="o-search-fulltext" [class.o-search-fulltext--vertical]="mode === 'vertical'">
  <div class="o-search-fulltext__container">
    <button
      #searchClass
      type="button"
      class="o-search-fulltext__classes"
      [class.o-search-fulltext__classes--inline]="mode === 'inline'"
      [pryOverlay]="classesOverlay"
      [(overlayOpen)]="panelClassesOpen"
      pryOverlayPosition="start-top"
      [pryOverlaySticky]="true"
      [pryOverlayNoPadding]="true"
      (click)="panelClassesOpen = true"
    >
      <span
        class="o-search-fulltext__classes__content a-tooltip"
        [attr.data-tooltip]="'@pry.search.fulltext.selectClass' | i18n"
        data-tooltip-position="bottom"
      >
        <pry-icon
          [iconSvg]="classesSelected.length === 0 ? 'apps' : 'detail'"
          [height]="20"
          [width]="20"
          [animation]="false"
        ></pry-icon>
        <span class="o-search-fulltext__classes__content__label" *ngIf="mode === 'inline'">
          {{ classesSelectedLabel | i18n : { nb: classesSelected.length } }}
        </span>
      </span>

      <span class="o-search-fulltext__classes__arrow">
        <pry-icon
          iconSvg="fleche_bas"
          [width]="17"
          [height]="17"
          [animation]="false"
          class="o-search-fulltext__classes__arrow__icon"
          [class.is-open]="panelClassesOpen"
        ></pry-icon>
      </span>
    </button>

    <pry-choose-widget
      [mode]="'input'"
      [class.m-choose-widget__input__inline]="mode === 'inline'"
      [panelOpen]="panelSearchOpen"
      [width]="searchPanelWidth ?? 200"
      (selected)="onSelectWidget($event)"
    >
      <input
        #searchInput
        [(ngModel)]="search"
        (input)="onChangeSearch($event)"
        (focusin)="onOpenSearchPanel()"
        (focusout)="onFocusOut()"
      />
      <div *ngIf="!searchDisabled" class="o-search-fulltext__input__clear">
        <div class="o-search-fulltext__input__clear__wrapper" (click)="onClearSearch($event)">
          <div
            class="a-tooltip"
            [attr.data-tooltip]="'@pry.search.fulltext.clear' | i18n"
            data-tooltip-position="bottom"
          >
            <pry-icon iconSvg="close" [height]="16" [width]="16" [animation]="false"></pry-icon>
            <span class="u-visually-hidden">{{ '@pry.search.fulltext.clear' | i18n }}</span>
          </div>
        </div>
      </div>
    </pry-choose-widget>
  </div>

  <button
    #searchButton
    class="a-btn a-btn--primary a-tooltip"
    (click)="onSearch()"
    [class.o-search-fulltext__button__inline]="mode === 'inline'"
    [ngClass]="{ ' -width-full': mode === 'vertical' }"
    [disabled]="searchDisabled"
    *ngIf="launchButton"
    [attr.data-tooltip]="'@pry.search.fulltext.search' | i18n"
    data-tooltip-position="bottom"
  >
    <pry-icon iconSvg="search-line" [animation]="false"></pry-icon>
    <span *ngIf="mode === 'vertical'">{{ '@pry.search.fulltext.search' | i18n }}</span>
    <span class="u-visually-hidden">{{ '@pry.search.fulltext.search' | i18n }}</span>
  </button>
</div>

<ng-template #classesOverlay>
  <div
    class="o-search-fulltext__classes-overlay"
    #chooseClasses
    (keydown.escape)="closeFocus()"
    (keydown.arrowDown)="onArrowDown()"
    (keydown.arrowUp)="onArrowUp()"
  >
    <button class="o-search-fulltext__classes-overlay__item" (click)="onSelectAllClasses()">
      <pry-icon iconSvg="apps" [width]="20" [height]="20"></pry-icon>
      <span class="o-search-fulltext__classes-overlay__item__label">{{
        '@pry.search.fulltext.allClasses' | i18n
      }}</span>
    </button>
    <ng-container *ngFor="let clazz of classes$ | async; let last = last">
      <button
        type="button"
        class="o-search-fulltext__classes-overlay__item"
        (click)="onSelectClass(clazz)"
        [class.o-search-fulltext__classes-overlay__item__selected]="classesSelected.includes(clazz.id)"
        (keydown.tab)="last ? closeFocus() : null"
      >
        <img
          alt="class"
          [height]="20"
          [width]="20"
          [src]="clazz.id | translateId : { type: 'class', output: 'icon' } | async"
        />
        <span class="o-search-fulltext__classes-overlay__item__label">{{ clazz.name }}</span>
      </button>
    </ng-container>
  </div>
</ng-template>
