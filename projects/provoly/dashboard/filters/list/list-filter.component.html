<pry-list-filter-css></pry-list-filter-css>
<div class="m-filter__input-wrapper m-filter__input-wrapper--dropdown" *ngIf="filter">
  <label class="a-label m-filter__label" for="{{ filter.name }}">{{ filter.name }}&nbsp;:&nbsp;</label>
  <pry-select
    [id]="filter.name"
    [items]="possibleValues"
    [ngModel]="filter.value"
    (ngModelChange)="setFilter($event)"
    [clearable]="true"
    [autocomplete]="true"
    aria-labelledby="item-label"
  ></pry-select>
</div>
