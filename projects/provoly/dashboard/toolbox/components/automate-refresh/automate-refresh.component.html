<div [pryTooltip]="infoTooltip" pryTooltipPosition="bottom" aria-describedby="infoTooltip_automateRefresh">
  <button type="button" class="a-btn a-btn--secondary -size-md">
    <ng-container *ngIf="displayLabels">
      {{ '@pry.toolbox.automateRefresh' | i18n }}
    </ng-container>
  </button>
</div>
<ng-template #infoTooltip>
  <div class="m-tooltip" role="tooltip" id="infoTooltip_automateRefresh">
    <span class="m-tooltip__text">{{ '@pry.toolbox.automateRefresh' | i18n }}</span>
  </div>
</ng-template>
