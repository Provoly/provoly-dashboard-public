<pry-toolbox-css></pry-toolbox-css>
<button
  type="button"
  class="a-btn a-btn--secondary automate-btn"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  (click)="toggleDatasourceList()"
  [disabled]="((datasources$ | async)?.length ?? 0) < 1"
>
  <ng-container *ngIf="displayLabels">
    {{ '@pry.toolbox.automateRefresh' | i18n }}
  </ng-container>
</button>

<ng-template #datasourceList>
  <div *ngIf="datasources$ | async as dataSources">
    <button
      *ngIf="dataSources.length > 0"
      class="refresh-line a-btn a-btn--icon-text -size-sm ds-0"
      (click)="toggleRefreshRateList('all', 0)"
      [class.-selected]="selectedDatasourceId === 'all'"
    >
      Tous
    </button>
    <button
      *ngFor="let datasourceId of dataSources; let i = index"
      class="refresh-line a-btn a-btn--icon-text -size-sm ds-{{ i + 1 }}"
      (click)="toggleRefreshRateList(datasourceId, i + 1)"
      [class.-selected]="selectedDatasourceId === datasourceId"
    >
      {{ datasourceId | translateId : { type: 'datasource', output: 'name' } | async }}
    </button>
  </div>
</ng-template>

<ng-template #refreshRateList>
  <div>
    <button
      *ngFor="let rate of refreshRates"
      class="refresh-line a-btn a-btn--icon-text -size-sm"
      (click)="toggleRefreshRate(rate)"
    >
      <pry-icon
        [width]="20"
        [height]="20"
        iconSvg="check"
        *ngIf="
          (selectedDatasourceId === 'all'
            ? (allRefreshRate$ | async)
            : ((refreshRates$ | async) ?? {})[selectedDatasourceId] ?? 0) === rate
        "
      ></pry-icon>
      {{ '@pry.search.namedQuery.refresh.' + rate | i18n }}
    </button>
  </div>
</ng-template>
