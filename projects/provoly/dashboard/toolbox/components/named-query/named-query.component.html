<div class="o-named-query">
  <div class="combobox-container" (dragleave)="dragLeave($event)">
    <div [pryTooltip]="infoTooltip" pryTooltipPosition="bottom" aria-describedby="infoTooltip_namedQuery">
      <button type="button" class="a-btn a-btn--action" (click)="toggle()">
        <pry-icon iconSvg="data_usage"></pry-icon>
        <ng-container *ngIf="label">{{ '@pry.toolbox.resultSet' | i18n }}</ng-container>
      </button>
    </div>

    <div class="combobox" *ngIf="displayCombo" (mouseleave)="toggle()">
      <ng-container *ngFor="let rs of namedQueries$ | async">
        <div draggable="true" (dragstart)="dragStart($event, rs)">
          {{ rs | translateId: { type: 'datasource', output: 'name' } | async }}
        </div>
      </ng-container>
    </div>
  </div>

  <ng-template #infoTooltip>
    <div class="m-tooltip" role="tooltip" id="infoTooltip_namedQuery">
      <span class="m-tooltip__text"> Recherches nommées </span>
    </div>
  </ng-template>
</div>
