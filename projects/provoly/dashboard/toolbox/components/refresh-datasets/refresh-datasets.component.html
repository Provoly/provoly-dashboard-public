  <button type="button" class="a-btn a-btn--secondary -size-md" (click)="refresh()" [disabled]="datasetCount < 1">
    <ng-container *ngIf="displayLabels">
      {{ '@pry.toolbox.refresh' | i18n }}
    </ng-container>
    <pry-icon iconSvg="synchro"></pry-icon>
  </button>
</div>
