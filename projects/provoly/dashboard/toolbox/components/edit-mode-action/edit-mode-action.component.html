<ng-container *ngIf="this.presentation?.current?.owner">
  <button type="button" class="a-btn a-btn--secondary" (click)="toggleEditionMode()">
    <ng-container *ngIf="displayLabels"
      >{{ ((modeEdition$ | async) ? '@pry.toolbox.editOff' : '@pry.toolbox.edit') | i18n }}
    </ng-container>
  </button>
</ng-container>
