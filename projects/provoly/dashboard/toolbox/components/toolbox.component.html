<ul class="m-actions-list" #input>
  <li class="m-actions-list__item" *ngIf="isManualMode$ | async">
    <pry-edit-mode-toggle
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'edit_dashboard' }"
      [label]="labels"
    ></pry-edit-mode-toggle>
  </li>
  <li class="m-actions-list__item">
    <pry-filter-settings
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'default_size' }"
      [style.z-index]="2"
      [label]="labels"
    ></pry-filter-settings>
  </li>
  <li class="m-actions-list__item">
    <pry-launch-tab
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'new_tab' }"
      [label]="labels"
    ></pry-launch-tab>
  </li>
  <li class="m-actions-list__item">
    <pry-drag-widgets
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'drag_widget' }"
      [labels]="labels"
    ></pry-drag-widgets>
  </li>
  <li class="m-actions-list__item">
    <pry-save-view
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'save_view' }"
      [style.z-index]="2"
      [label]="labels"
    ></pry-save-view>
  </li>
  <li class="m-actions-list__item" *ngIf="hasInitialPresentation$ | async">
    <pry-save-view
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'save_view' }"
      [style.z-index]="2"
      [label]="labels"
      mode="directSave"
    ></pry-save-view>
  </li>
  <li class="m-actions-list__item">
    <pry-clear-view
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'clear_view' }"
      [style.z-index]="2"
      [label]="labels"
    ></pry-clear-view>
  </li>
  <li class="m-actions-list__item is-screen-size-select">
    <pry-select-grid-layout
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'default_size' }"
      [style.z-index]="2"
      [label]="labels"
    ></pry-select-grid-layout>
  </li>
</ul>
