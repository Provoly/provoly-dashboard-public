<ul class="m-actions-list" #input>
  <ng-container *ngFor="let action of mainActions$ | async">
    <ng-container *ngIf="action.visible">
      <li class="m-actions-list__item" *pryAccess="action.access">
        <pry-toolbox-action-instanciator
          [action]="action"
          [displayLabels]="displayLabels"
        ></pry-toolbox-action-instanciator>
      </li>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="dropdownActions.length > 0">
    <li class="m-actions-list__item">
      <button
        type="button"
        class="a-btn a-btn--primary -size-md"
        cdkOverlayOrigin
        #trigger="cdkOverlayOrigin"
        id="widget_insert"
        aria-controls="IDpanel"
        aria-expanded="false"
        (click)="openDropdown($event)"
      >
        <ng-container *ngIf="displayLabels"
          ><span class="u-visually-hidden">{{ '@pry.toolbox.options' | i18n }}</span>
          <span>{{ '@pry.toolbox.options' | i18n }}</span>
          <pry-icon [width]="14" [height]="14" iconSvg="chevron_bottom"></pry-icon>
        </ng-container>
      </button>
    </li>
    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="isDropdownOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="isDropdownOpen = false"
    >
      <div class="o-draggable-menu" aria-labelledby="">
        <ul class="o-draggable-menu__list">
          <li
            *ngFor="let action of dropdownActions$ | async"
            class="o-draggable-menu__list__item"
            [style.order]="getOrder(action.name)"
          >
            <pry-toolbox-action-instanciator
              [action]="action"
              [displayLabels]="displayLabels"
            ></pry-toolbox-action-instanciator>
          </li>
        </ul>
      </div>
    </ng-template>
  </ng-container>
  <li class="m-actions-list__item" *ngIf="isManualMode$ | async">
    <pry-edit-mode-toggle
      *pryAccess="{ module: 'dashboard', page: 'toolbox', action: 'edit_dashboard' }"
      [displayLabels]="displayLabels"
    ></pry-edit-mode-toggle>
  </li>
</ul>
