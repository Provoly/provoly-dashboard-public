<ng-container *ngIf="this.presentation?.current?.owner">
  <button type="button" class="a-btn a-btn--secondary -size-md" (click)="trigger()">
    <ng-container *ngIf="displayLabels">{{ '@pry.toolbox.share' | i18n }}</ng-container>
  </button>
</ng-container>
<ng-template #modal>
  <div
    class="o-modal"
    #visibilityModal
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog change visibility"
    *ngIf="presentation as selectedPresentation"
  >
    <div class="o-modal__top">
      <div class="o-modal__top__title">
        <h2 class="a-h2" id="dialog_title">{{ '@pry.toolbox.share' | i18n }}</h2>
      </div>
      <div class="o-modal__top__close">
        <button class="a-btn a-btn--icon-only" #crossVisibility (click)="toggleModal()">
          <pry-icon iconSvg="close" [height]="35" [width]="35"></pry-icon>
          <span class="u-visually-hidden">{{ '@pry.toolbox.close' | i18n }}</span>
        </button>
      </div>
    </div>
    <pry-group-share
      [ngModel]="selectedPresentation.current?.groups"
      (ngModelChange)="accessGroups = $event"
    ></pry-group-share>
    <div class="m-btn-group">
      <button type="button" class="a-btn a-btn--secondary" (click)="toggleModal()">
        {{ '@pry.toolbox.manifest.close' | i18n }}
      </button>
      <button type="submit" class="a-btn a-btn--primary" #submit (click)="changeVisibility()">
        {{ '@pry.toolbox.manifest.check' | i18n }}
      </button>
    </div>
  </div>
</ng-template>
