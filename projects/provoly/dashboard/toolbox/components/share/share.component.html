@if (currentManifest?.owner) {
  <button type="button" class="a-btn a-btn--secondary" (click)="trigger()">
    @if (displayLabels) {
      {{ '@pry.toolbox.share' | i18n }}
    }
  </button>
}

<ng-template #modal>
  @if (currentManifest) {
    <div class="o-modal" #shareModal role="dialog" aria-modal="true" aria-labelledby="dialog share access rights">
      <div class="o-modal__top">
        <div class="o-modal__top__title">
          <h2 class="a-h2" id="dialog_title">{{ '@pry.toolbox.share' | i18n }}</h2>
        </div>
        <div class="o-modal__top__close">
          <button class="a-btn a-btn--icon-only" (click)="toggleModal()">
            <pry-icon iconSvg="close" [height]="35" [width]="35"></pry-icon>
            <span class="u-visually-hidden">{{ '@pry.toolbox.close' | i18n }}</span>
          </button>
        </div>
      </div>
      <pry-access-rights-share
        [(ngModel)]="currentManifest.accessRightsByGroup"
        (ngModelChange)="updateAccessRights($event)"
        [manifestDescription]="currentManifest"
      ></pry-access-rights-share>
      <div class="m-btn-group">
        <button type="button" class="a-btn a-btn--secondary" (click)="toggleModal()">
          {{ '@pry.toolbox.manifest.close' | i18n }}
        </button>
        <button type="submit" class="a-btn a-btn--primary" #submit (click)="validate()" [disabled]="this.disableShareButton$ | async">
          {{ '@pry.toolbox.manifest.check' | i18n }}
        </button>
      </div>
    </div>
  }
</ng-template>
