<div [pryTooltip]="infoTooltip" pryTooltipPosition="bottom" aria-describedby="infoTooltip_launchTab">
  <button type="button" class="a-btn a-btn--secondary -size-md" (click)="launchNewWindow()">
    <ng-container *ngIf="label"
      ><span class="u-visually-hidden">{{ '@pry.toolbox.launchIndication' | i18n }}</span
      >{{ '@pry.toolbox.launch' | i18n }}</ng-container
    >
    <pry-icon iconSvg="launch"></pry-icon>
  </button>
</div>

<ng-template #infoTooltip>
  <div class="m-tooltip" role="tooltip" id="infoTooltip_launchTab">
    <span class="m-tooltip__text">Nouvelle page</span>
  </div>
</ng-template>
