<pry-toolbox-css></pry-toolbox-css>
<div [attr.aria-expanded]="modalOpened" aria-controls="grid-layout">
  <button type="button" #openModal class="a-btn a-btn--secondary" (click)="toggleGridChoiceModal()">
    @if (displayLabels) {
      {{ '@pry.toolbox.chooseGrid' | i18n }}
    }
  </button>
</div>
<ng-template #template>
  <div
    class="o-modal"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    aria-labelledby="dialog_title"
    id="grid-layout"
    (keydown.escape)="toggleGridChoiceModal()"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    >
    <div class="o-modal__top">
      <div class="o-modal__top__title">
        <h2 class="a-h2" id="dialog_title">{{ '@pry.toolbox.chooseGrid' | i18n }}</h2>
      </div>
      <div class="o-modal__top__close">
        <button class="a-btn a-btn--icon-only" (click)="toggleGridChoiceModal()">
          <pry-icon iconSvg="close" [height]="35" [width]="35"></pry-icon>
          <span class="u-visually-hidden">{{ '@pry.toolbox.close' | i18n }}</span>
        </button>
      </div>
    </div>
    <div class="o-select-grid-layout-wrapper">
      <ul class="o-select-grid-layout">
        @for (layout of availableLayouts$ | async; track layout) {
          <li class="o-select-grid-layout__item">
            <button
              type="button"
              #firstButton
              class="a-btn"
              [attr.aria-pressed]="chosenLayout === layout.type"
              [class.selected]="chosenLayout === layout.type"
              (click)="changeLayout(layout.type)"
              >
              <div class="o-select-grid-layout__item__preview">
                <pry-dashboard
                [staticDashboard]="{
                  widgets: [],
                  grid: { layout: layout.type, rows: layout.rows, columns: layout.columns, gap: 3 }
                }"
                  [breakpoint]="10"
                  [noBackground]="true"
                  [forceModeEdition]="false"
                ></pry-dashboard>
              </div>
              <p class="a-p">
                <strong>{{ layout.label ?? '' | i18n }}</strong>
              </p>
              <p class="a-p">
                {{ layout.description ?? '' | i18n }}
              </p>
            </button>
          </li>
        }
      </ul>
    </div>
    <div class="m-btn-group -space-evenly">
      <button (click)="toggleGridChoiceModal()" class="a-btn a-btn--secondary">
        {{ '@pry.toolbox.manifest.close' | i18n }}
      </button>
      <button (click)="validate()" class="a-btn a-btn--primary">
        {{ '@pry.toolbox.manifest.validated' | i18n }}
      </button>
    </div>
  </div>
</ng-template>
