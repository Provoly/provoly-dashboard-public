<pry-notification-css></pry-notification-css>
@if (notifications$ | async; as notifications) {
  <div
    class="m-notifications"
    [class.has-unread]="notifications.length > 0"
    >
    <button
      type="button"
      class="a-btn a-btn--icon-only"
      aria-controls="notifications_list"
      [attr.aria-expanded]="isOpened"
      aria-haspopup="true"
      id="read_notifications"
      #ref
      (click)="toggle()"
      [title]="notifications.length <= 1 ? ('@pry.notif.notification' | i18n: {count : notifications.length} ) : ('@pry.notif.notifications' | i18n : {count : notifications.length})"
      >
      <pry-icon iconSvg="notifications"></pry-icon>
      @if (notifications.length > 0) {
        <span class="a-pastille -unread">
          @if(notifications.length < 100 ) {
            {{ notifications.length }}
          } @else {
            99<sup>+</sup>
          }
          <span class="u-visually-hidden">{{ '@pry.notif.label' | i18n | lowercase }}</span>
        </span>
      }
    </button>
  </div>
}
