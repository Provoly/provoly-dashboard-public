<label class="a-checkbox" [class.a-checkbox--circle]="circle" [for]="inputId">
  <input
    class="a-checkbox__input"
    type="checkbox"
    [id]="inputId"
    [name]="name"
    [ngModel]="checked"
    (ngModelChange)="writeValue($event)"
    [disabled]="disabled"
  />
  <span class="a-checkbox__text">
    <ng-content></ng-content>
  </span>
</label>
