<pry-metadata-editor-css></pry-metadata-editor-css>
<div *ngFor="let metadata of (_metadata$ | async) ?? []">
  <div class="o-tabs__panel__content__actions">
    <div class="o-tabs__panel__content__actions__text">
      <span class="o-tabs__panel__content__actions__text__label">{{ metaDefinition(metadata).name }} :</span>
      <span class="o-tabs__panel__content__actions__text__value">{{ metadata.value }}</span>
    </div>

    <div class="o-tabs__panel__content__actions__buttons">
      <ng-container *pryAccess="{ module: 'admin', page: 'dataset', action: 'write' }">
        <button type="button" class="a-btn a-btn--icon-only" aria-pressed="false">
          <span class="u-visually-hidden">{{ '@pry.action.edit' | i18n }} {{ metaDefinition(metadata).name }}</span>
          <pry-icon
            class="edit-icon"
            iconSvg="edit"
            [width]="15"
            [height]="15"
            (click)="editMetadata(metadata)"
          ></pry-icon>
        </button>
        <button type="button" class="a-btn a-btn--icon-only" aria-pressed="false">
          <span class="u-visually-hidden">{{ '@pry.action.delete' | i18n }} {{ metaDefinition(metadata).name }}</span>
          <pry-icon
            class="delete-icon"
            iconSvg="delete"
            [width]="15"
            [height]="15"
            (click)="removeMetadata(metadata)"
          ></pry-icon>
        </button>
      </ng-container>
    </div>
  </div>
</div>

<ng-container *pryAccess="{ module: 'admin', page: 'dataset', action: 'write' }">
  <form class="o-form -border-top" [formGroup]="form" (ngSubmit)="addDatasetMetadata()">
    <fieldset>
      <legend class="u-visually-hidden">{{ '@pry.action.editProfil' | i18n }}</legend>

      <div class="m-form-label-field o-metadata-editor__container">
        <label for="metadata" id="metadata-label" class="a-label">Data</label>
        <pry-select
          id="metadata"
          class="a-pry-select o-metadata-editor"
          formControlName="metadata"
          [items]="availableMetadata$ | async"
          (ngModelChange)="onMetaChange($event)"
          [isForm]="true"
          [itemsAsOption]="true"
          bindLabel="name"
          [attr.aria-labelledby]="
            isSubmitted && form.get('metadata')?.invalid ? 'metadata-label metadata-error' : 'metadata-label'
          "
          [attr.aria-invalid]="isSubmitted && form.get('metadata')?.invalid"
        >
        </pry-select>
        <label
          *ngIf="isSubmitted && form.get('metadata')?.invalid"
          id="metadata-error"
          for="metadata"
          class="a-label a-label--help -error"
        >
          {{ '@pry.admin.required' | i18n }}
        </label>
      </div>

      <ng-container *ngIf="form.value.metadata">
        <ng-container *ngIf="form.value['metadata']['type'] === 'DATE'; else inputList">
          <div class="m-form-label-field">
            <label id="form_date-label" for="form_date" class="a-label">
              {{ '@pry.action.selectDate' | i18n }} *
              <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
            </label>
            <input
              id="form_date"
              type="date"
              class="a-form-field"
              formControlName="value"
              [attr.aria-labelledby]="
                isSubmitted && form.get('value')?.invalid ? 'form-date-label form-date-error' : 'form-date-label'
              "
              [attr.aria-invalid]="isSubmitted && form.get('value')?.invalid"
              required
            />
            <label
              *ngIf="isSubmitted && form.get('value')?.invalid"
              id="form_date-error"
              for="form_date"
              class="a-label a-label--help -error"
            >
              {{ '@pry.admin.required' | i18n }}
            </label>
          </div>
        </ng-container>

        <ng-template #inputList>
          <ng-container *ngIf="form.value['metadata']['type'] === 'LIST'; else inputText">
            <div class="m-form-label-field">
              <label id="list-label" class="a-label" for="list">{{ '@pry.action.choiceInList' | i18n }}</label>
              <pry-select
                id="list"
                class="a-pry-select"
                formControlName="value"
                [items]="form.value['metadata']['allowedValues']"
                [isForm]="true"
                aria-labelledby="list-label"
              ></pry-select>
            </div>
          </ng-container>
        </ng-template>

        <ng-template #inputText>
          <div class="m-form-label-field">
            <label id="text-label" class="a-label" for="text">
              {{ '@pry.action.text' | i18n }} *
              <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
            </label>
            <input
              id="text"
              type="text"
              class="a-form-field"
              formControlName="value"
              [attr.aria-labelledby]="
                isSubmitted && form.get('value')?.invalid ? 'text-label text-error' : 'text-label'
              "
              [attr.aria-invalid]="isSubmitted && form.get('value')?.invalid"
              required
            />
            <label
              *ngIf="isSubmitted && form.get('value')?.invalid"
              id="test-error"
              for="text"
              class="a-label a-label--help -error"
            >
              <span *ngIf="form.get('value')?.hasError('required')">{{ '@pry.admin.required' | i18n }}</span>
              <ng-container *ngIf="form.get('value')?.hasError('pattern')">
                <span *ngIf="form.value['metadata']['type'] === 'DOUBLE'">
                  {{ '@pry.admin.environment.formatDouble' | i18n }}
                </span>
                <span *ngIf="form.value['metadata']['type'] === 'INTEGER'">
                  {{ '@pry.admin.environment.formatInt' | i18n }}
                </span>
              </ng-container>
            </label>
          </div>
        </ng-template>
      </ng-container>
    </fieldset>

    <div class="m-btn-group -end">
      <button type="submit" class="a-btn a-btn--primary">
        {{ (isModification ? '@pry.action.editMetadata' : '@pry.action.addMetadata') | i18n }}
      </button>
    </div>
  </form>
</ng-container>
