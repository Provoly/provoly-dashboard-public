<div class="o-pry-card-header">
  <div *ngIf="marker" class="o-pry-card-header__marker"></div>
  <ng-container *ngIf="_iconChildren?.length">
    <div class="o-pry-card-header__icon-wrapper">
      <ng-content select="pry-card-icon, [o-pry-card-icon], [pryCardIcon]"></ng-content>
    </div>
  </ng-container>

  <div class="o-pry-card-header__title-wrapper">
    <ng-content select="pry-card-title, pry-card-subtitle"></ng-content>
  </div>

  <ng-container *ngIf="_menuChildren?.length">
    <button
      aria-controls="btn_actions"
      [attr.aria-expanded]="menuOpen"
      type="button"
      class="a-btn a-btn--icon-only -circle -size-sm o-pry-card-menu-trigger a-tooltip"
      (click)="focusChild(); menuOpen = true; $event.stopPropagation()"
      [attr.data-tooltip]="'@pry.search.home.otherActions' | i18n"
      data-tooltip-position="left"
      [class.active]="menuOpen"
      cdkOverlayOrigin
      #trigger
    >
      <pry-icon iconSvg="more_vertical" [width]="18" [height]="18"></pry-icon>
      <span class="u-visually-hidden">{{ '@pry.search.home.otherActions' | i18n }}</span>
    </button>

    <ng-template
      cdkConnectedOverlay
      [cdkConnectedOverlayOrigin]="trigger"
      [cdkConnectedOverlayOpen]="menuOpen"
      [cdkConnectedOverlayHasBackdrop]="true"
      [cdkConnectedOverlayPositions]="overlayPositions"
      cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
      (backdropClick)="menuOpen = false"
    >
      <div
        class="o-pry-card-menu-wrapper"
        aria-labelledby="btn_actions"
        #menuList
        (keydown.arrowUp)="onArrowUp()"
        (keydown.arrowDown)="onArrowDown()"
        (keydown.escape)="closeToEscape()"
      >
        <ng-content
          select="pry-card-menu, [o-pry-card-menu], [pryCardMenu]"
          cdkTrapFocus
          [cdkTrapFocusAutoCapture]="true"
        ></ng-content>
      </div>
    </ng-template>
  </ng-container>
</div>
