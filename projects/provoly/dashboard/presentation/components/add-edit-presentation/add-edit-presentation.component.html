<div class="o-manifest-layout">
  <div class="o-manifest-layout__toolbox -justify-space-between -align-center">
    <button class="a-btn a-btn--secondary" type="button" (click)="close()">
      {{ '@pry.toolbox.manifest.close' | i18n }}
    </button>
    <button class="a-btn a-btn--primary" type="button" (click)="save()" [disabled]="!isFormValid">
      {{ '@pry.toolbox.manifest.check' | i18n }}
    </button>
  </div>
  <div class="o-manifest-layout__content--presentation">
    <h2 class="a-h2">{{ '@pry.presentation.add' + '.pageTitle' | i18n }}</h2>
    <div class="o-presentation-form-wrapper">
      <div class="u-display-flex -column">
        <pry-presentation-form
          mode="theme"
          [selectedPresentation]="(selectedPresentation$ | async) ?? undefined"
          (formValue)="formValue = $event"
          (isFormValid)="isFormValid = $event"
          [mode]="mode"
          [themePrefix]="themePrefix"
        ></pry-presentation-form>
        <div class="m-form-label-field -width-full m-form-label-field--inline">
          <label class="a-label">{{ '@pry.presentation.form.grid' | i18n }}</label>
          <span class="a-label">{{ '@pry.toolbox.layout.' + this.chosenLayout | i18n }}</span>
          @if (!edition) {
            <pry-select-grid-layout></pry-select-grid-layout>
          }
        </div>
      </div>
      @if (mode === 'meta') {
        @if (selectedPresentation$ | async; as selectedPresentation) {
          <div class="o-presentation__metadata-editor">
            <pry-metadata-editor
              [targetId]="selectedPresentation.id"
              [isModification]="true"
              [metadata]="selectedPresentation.metadata ?? []"
              (removeMeta)="removeMetadata($event)"
              (addMeta)="addMetadata($event)"
              [type]="'meta'"
            ></pry-metadata-editor>
          </div>
        }
      }
    </div>
    <button
      class="a-btn a-btn--primary"
      (click)="configureDashboard(selectedPresentation$.value!)"
      [disabled]="!isFormValid"
      >
      {{ '@pry.presentation.configuration' | i18n }}
    </button>
  </div>
</div>
