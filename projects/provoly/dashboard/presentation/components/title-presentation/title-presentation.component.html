@if (currentPresentation$ | async; as currentPresentation) {
  <div class="m-presentation-title u-display-flex -gap-10">
    <h1 class="a-h2 m-presentation-title__text">
      {{ currentPresentation.name || ('@pry.header.noCurrentPresentation' | i18n) }}
    </h1>
    @if (!!currentPresentation.description) {
      <div
        class="m-presentation-title__description m-info-icon a-tooltip -tooltip-width-lg align-center"
        [attr.data-tooltip]="currentPresentation.description"
        data-tooltip-position="right"
        >
        <span>i</span>
      </div>
    }
  </div>
}
