<div class="m-tooltip__item__content">
  <h3 class="a-h3 -attribute">
    <img
      [src]="data.item | translateItemToSymbol | async"
      [alt]="data.item.oClass | translateId: { type: 'class', output: 'name' } | async"
      [title]="data.item.oClass | translateId: { type: 'class', output: 'name' } | async"
      width="32"
      aria-hidden="true"
      />
    <span [title]="data.item.oClass | translateId: { type: 'class', output: 'name' } | async">{{
      data.item.oClass | translateId: { type: 'class', output: 'name' } | async
    }}</span>
  </h3>
  @for (attribute of attributes$ | async; track attribute) {
    <p [title]="getValue(attribute.technicalName) | async | dataFormat: attribute.field">
      <span>{{ attribute.name }}:</span>
      {{ getValue(attribute.technicalName, 40) | async | dataFormat: attribute.field }}
    </p>
  }
</div>
