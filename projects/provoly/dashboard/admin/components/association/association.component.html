@for (association of associations?.associations; track association) {
  <div class="a-container-type">
    <p class="a-label-type {{ association.type }}">
      <strong>{{ '@pry.admin.association.' + association.type | i18n }}</strong>
    </p>
    <p>
      {{ association.name }}
    </p>
  </div>
}
@if (associations?.usedElsewhere === true) {
  <p class="a-p">
    <strong>{{ '@pry.admin.classes.usedElsewhere' | i18n }}</strong>
  </p>
}
