<ng-container *ngIf="condition$ | async as condition">
  <ng-container *ngIf="attribute$ | async as attr; else noAttribute">
    <ng-container *ngIf="field$ | async as field; else noField">
      <div class="o-pry-attribute-condition">
        <button
          type="button"
          class="a-btn a-btn--icon-only"
          aria-pressed="false"
          *ngIf="!readonly"
          (click)="onOpenPanel()"
          cdkOverlayOrigin
          #origin="cdkOverlayOrigin"
        >
          <pry-icon iconSvg="drag_indicator"></pry-icon>
          <span class="u-visually-hidden">{{ '@pry.admin.abac-rules.delete' | i18n }}</span>

          <ng-template
            cdkConnectedOverlay
            cdkConnectedOverlayHasBackdrop
            cdkConnectedOverlayLockPosition
            cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
            [cdkConnectedOverlayOrigin]="origin"
            [cdkConnectedOverlayOpen]="panelOpen"
            (backdropClick)="onClosePanel()"
          >
            <div class="m-pry-overlay-panel-wrapper">
              <div class="m-pry-overlay-panel">
                <button
                  class="pry-condition-delete"
                  (click)="onDeleteAttributeCondition(condition.id, condition.parentId)"
                >
                  {{ '@pry.admin.abac-rules.delete' | i18n }}
                </button>
              </div>
            </div>
          </ng-template>
        </button>

        <div class="m-form-label-field">
          <label class="a-label u-visually-hidden" for="attr_name">Name</label>
          <input id="attr_name" class="a-form-field" type="text" [value]="attr.name" readonly />
        </div>

        <div class="m-form-label-field">
          <label class="a-label u-visually-hidden" for="condition_operator">???</label>
          <pry-select
            id="condition_operator"
            [style.width.px]="160"
            [items]="operatorOptions$ | async"
            bindValue="operator"
            bindLabel="translation"
            [ngModel]="condition.operator"
            (ngModelChange)="onChangeOperator($event, condition.id)"
            [readonly]="readonly"
          ></pry-select>
        </div>

        <div class="m-form-label-field">
          <label class="a-label u-visually-hidden" for="condition_value">Name</label>
          <input
            id="condition_value"
            [readonly]="readonly"
            type="text"
            class="a-form-field"
            [value]="condition.value"
            (focusout)="onChangeValue($event, condition.id)"
          />
        </div>
      </div>
    </ng-container>
    <ng-template #noField> Loading field ...</ng-template>
  </ng-container>
  <ng-template #noAttribute> Loading attribute ...</ng-template>
</ng-container>
