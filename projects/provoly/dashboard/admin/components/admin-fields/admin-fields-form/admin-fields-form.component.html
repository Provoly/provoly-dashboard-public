<div>
  <form class="o-form" [formGroup]="fieldForm" (ngSubmit)="addField()">
    <div class="m-form-label-field -width-sm">
      <label id="name-label" for="field_name" class="a-label">
        {{ '@pry.admin.fields.name' | i18n }} *
        <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
      </label>
      <input
        id="field_name"
        type="text"
        class="a-form-field"
        formControlName="name"
        [attr.aria-labelledby]="isSubmitted && fieldForm.get('name')?.invalid ? 'name-label name-error' : 'name-label'"
        [attr.aria-invalid]="isSubmitted && fieldForm.get('name')?.invalid"
        required
      />
      <label
        *ngIf="isSubmitted && fieldForm.get('name')?.invalid"
        id="name-error"
        for="field_name"
        class="a-label a-label--help -error"
      >
        <span *ngIf="fieldForm.get('name')?.hasError('same-name')">{{ '@pry.admin.exists' | i18n }}</span>
        <span *ngIf="fieldForm.get('name')?.hasError('required')">{{ '@pry.admin.required' | i18n }}</span>
        <span *ngIf="fieldForm.get('name')?.hasError('minlength')">{{
          '@pry.admin.minLength' | i18n : { len: 3 }
        }}</span>
        <span *ngIf="fieldForm.get('name')?.hasError('maxlength')">{{
          '@pry.admin.maxLength' | i18n : { len: 100 }
        }}</span>
        <span *ngIf="fieldForm.get('name')?.hasError('whitespace') && !fieldForm.get('name')?.hasError('minlength')">{{
          '@pry.admin.noWhitespace' | i18n
        }}</span>
      </label>
    </div>

    <div class="m-form-label-field -width-sm">
      <label class="a-label">
        {{ '@pry.admin.fields.type' | i18n }} *
        <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
      </label>
      <div class="title-container">
        <pry-select
          class="-width-sm"
          formControlName="type"
          [items]="fieldTypeTranslations"
          bindValue="varType"
          bindLabel="translation"
          [isForm]="true"
        ></pry-select>
        <ng-container>
          <div class="info-icon description-container description">
            <span class="info-text">i</span>
          </div>
          <div class="description-tooltip title-tooltip">
            <p class="a-p -date">{{ selectedFieldTypeDescription$ | async }}</p>
          </div>
        </ng-container>
      </div>
    </div>

    <div class="m-form-label-field -width-sm" *ngIf="isGeographicType">
      <label class="a-label">
        {{ '@pry.admin.fields.crs' | i18n }} *
        <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
      </label>
      <div class="title-container">
        <pry-select
          class="-width-sm"
          formControlName="crs"
          [items]="CRS_OPTIONS"
          bindValue="code"
          bindLabel="label"
          [isForm]="true"
          id="crs"
        ></pry-select>
      </div>
      <label
        *ngIf="isSubmitted && fieldForm.get('crs') && fieldForm.get('crs')?.invalid"
        id="crs-error"
        for="crs"
        class="a-label a-label--help -error"
      >
        <span *ngIf="fieldForm.get('name')?.hasError('required')">{{ '@pry.admin.required' | i18n }}</span>
      </label>
    </div>

    <div class="m-btn-group -width-sm">
      <button
        type="button"
        class="a-btn a-btn--secondary"
        (click)="goBack()"
        [innerHTML]="'@pry.admin.cancel' | i18n"
      ></button>
      <button
        class="a-btn a-btn--primary"
        type="submit"
        [innerHTML]="(currentField ? '@pry.admin.edit' : '@pry.admin.create') | i18n"
      ></button>
    </div>
  </form>
</div>
