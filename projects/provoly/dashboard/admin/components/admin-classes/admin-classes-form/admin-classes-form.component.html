<form class="o-form" [formGroup]="classForm" (ngSubmit)="addClass()">
  <div class="m-form-label-field -width-sm">
    <label class="a-label" id="name-label" for="name">
      {{ '@pry.admin.classes.name' | i18n }} *
      <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
    </label>
    <input
      [attr.aria-labelledby]="isSubmitted && classForm.get('name')?.invalid ? 'name-label name-error' : 'name-label'"
      class="a-form-field"
      formControlName="name"
      id="name"
      required
      type="text"
      [attr.aria-invalid]="isSubmitted && classForm.get('name')?.invalid"
      />
    @if (isSubmitted && classForm.get('name')?.invalid) {
      <label
        id="name-error"
        for="name"
        class="a-label a-label--help -error"
        >
        @if (classForm.get('name')?.hasError('same-name')) {
          <span>{{ '@pry.admin.exists' | i18n }}</span>
        }
        @if (classForm.get('name')?.hasError('required')) {
          <span>{{ '@pry.admin.required' | i18n }}</span>
        }
        @if (classForm.get('name')?.hasError('minlength')) {
          <span>{{ '@pry.admin.minLength' | i18n: { len: 3 } }}</span>
        }
        @if (classForm.get('name')?.hasError('maxlength')) {
          <span>{{
            '@pry.admin.maxLength' | i18n: { len: 100 }
          }}</span>
        }
        @if (classForm.get('name')?.hasError('whitespace')) {
          <span>{{ '@pry.admin.noWhitespace' | i18n }}</span>
        }
      </label>
    }
  </div>
  <div class="u-display-flex -row -align-center">
    <div class="m-form-label-field -width-sm">
      <label class="a-label" for="storage_options">
        {{ '@pry.admin.storage.label' | i18n }}
        <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
      </label>
      <pry-select
        [items]="storageOptions$ | async"
        i18nPrefix="@pry.admin.storage.options."
        formControlName="storage"
        id="storage_options"
      ></pry-select>
    </div>
    <div
      class="m-info-icon a-tooltip -tooltip-width-md"
      [attr.data-tooltip]="'@pry.admin.storage.description.' + classForm.get('storage')?.value | i18n"
      data-tooltip-position="right"
      >
      <span>i</span>
    </div>
  </div>
  <div class="m-btn-group -width-sm">
    <button
      type="button"
      class="a-btn a-btn--secondary"
      (click)="goBack()"
      [innerHTML]="'@pry.admin.cancel' | i18n"
    ></button>
    <button
      class="a-btn a-btn--primary"
      type="submit"
      [innerHTML]="(_currentClass ? '@pry.admin.edit' : '@pry.admin.next') | i18n"
    ></button>
  </div>
</form>
