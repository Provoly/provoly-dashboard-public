<div class="o-base-container">
  <form class="o-form" [formGroup]="envForm" (ngSubmit)="addEnvironment()">
    <div class="m-form-label-field -width-sm">
      <label for="environment_name" id="name-label" class="a-label">
        {{ '@pry.admin.environment.name' | i18n }} *
        <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
      </label>
      <input
        id="environment_name"
        type="text"
        class="a-form-field"
        formControlName="name"
        [required]="!_currentEnv"
        [attr.aria-labelledby]="isSubmitted && envForm.get('name')?.invalid ? 'name-label name-error' : 'name-label'"
        [attr.aria-invalid]="isSubmitted && envForm.get('name')?.invalid"
        />
      @if (isSubmitted && envForm.get('name')?.invalid) {
        <label
          id="name-error"
          for="environment_name"
          class="a-label a-label--help -error"
          >
          @if (envForm.get('name')?.hasError('same-name')) {
            <span>{{ '@pry.admin.exists' | i18n }}</span>
          }
          @if (envForm.get('name')?.hasError('required')) {
            <span>{{ '@pry.admin.required' | i18n }}</span>
          }
          @if (envForm.get('name')?.hasError('pattern')) {
            <span>{{ '@pry.admin.environment.formatName' | i18n }}</span>
          }
        </label>
      }
    </div>

    <div class="m-form-label-field -width-sm">
      <label class="a-label" for="environment-type">{{ '@pry.admin.environment.type' | i18n }}</label>
      <pry-select
        id="environment-type"
        formControlName="type"
        [items]="envOptions"
        bindValue="varType"
        bindLabel="translation"
        (ngModelChange)="onTypeChange($event)"
        [isForm]="true"
      ></pry-select>
    </div>

    <div class="m-form-label-field -width-sm">
      @if (envForm.value.type === 'DATE') {
        <label class="a-label" for="value_date">
          {{ '@pry.admin.environment.value' | i18n }} *
          <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
        </label>
        <input type="date" id="value_date" class="a-form-field" formControlName="value" required />
        @if (isSubmitted && envForm.get('value')?.invalid && envForm.get('value')?.hasError('required')) {
          <label
            id="value_date_error"
            for="value_date"
            class="a-label a-label--help -error"
            >
            {{ '@pry.admin.required' | i18n }}
          </label>
        }
      } @else {
        <label id="value-label" class="a-label">{{ '@pry.admin.environment.value' | i18n }}</label>
        <input
          id="environment_value"
          type="text"
          class="a-form-field"
          formControlName="value"
          [attr.aria-labelledby]="
            isSubmitted && envForm.get('value')?.invalid ? 'value-label value-error' : 'value-label'
          "
          [attr.aria-invalid]="isSubmitted && envForm.get('value')?.invalid"
          required
          />
        @if (isSubmitted && envForm.get('value')?.invalid) {
          <label
            id="value-error"
            for="environment_value"
            class="a-label a-label--help -error"
            >
            @if (envForm.get('value')?.hasError('required')) {
              <span>{{ '@pry.admin.required' | i18n }}</span>
            }
            @if (envForm.get('value')?.hasError('pattern')) {
              @if (envForm.value.type === 'DOUBLE') {
                <span>{{ '@pry.admin.environment.formatDouble' | i18n }}</span>
              }
              @if (envForm.value.type === 'INTEGER') {
                <span>{{ '@pry.admin.environment.formatInt' | i18n }}</span>
              }
            }
          </label>
        }
      }

    </div>

    <div class="m-btn-group -width-sm">
      <button
        type="button"
        class="a-btn a-btn--secondary"
        (click)="goBack()"
        [innerHTML]="'@pry.admin.cancel' | i18n"
      ></button>
      <button
        class="predicate-create a-btn a-btn--primary"
        type="submit"
        [innerHTML]="(_currentEnv ? '@pry.admin.edit' : '@pry.admin.create') | i18n"
      ></button>
    </div>
  </form>
</div>
