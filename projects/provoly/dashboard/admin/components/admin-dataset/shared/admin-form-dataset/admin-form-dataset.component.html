<form class="o-form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="m-form-label-field -width-sm">
    <label class="a-label" id="name-label" for="name">
      {{ '@pry.admin.dataset.name' | i18n }} *
      <span class="u-visually-hidden">({{ '@pry.admin.required' | i18n }})</span>
    </label>
    <input
      id="name"
      type="text"
      class="a-form-field"
      formControlName="name"
      (ngModelChange)="changeValueName($event)"
      [attr.aria-labelledby]="isSubmitted && form.get('name')?.invalid ? 'name-label name-error' : 'name-label'"
      [attr.aria-invalid]="isSubmitted && form.get('name')?.invalid"
      required
    />
    <label
      class="a-label a-label--help -error"
      id="name-error"
      for="name"
      *ngIf="isSubmitted && form.get('name')?.invalid"
      >{{ '@pry.admin.required' | i18n }}</label
    >
  </div>

  <div class="m-form-label-field -width-sm">
    <label class="a-label" id="item-label" for="class">{{ '@pry.admin.dataset.oClass' | i18n }}</label>
    <pry-select
      class="a-pry-select"
      id="class"
      formControlName="oClass"
      [items]="classes | async"
      [itemsAsOption]="true"
      bindValue="id"
      bindLabel="name"
      [isForm]="true"
      aria-labelledby="item-label"
    ></pry-select>
  </div>

  <div class="m-form-label-field -width-sm">
    <label class="a-label" id="user-label" for="type">{{ '@pry.admin.dataset.type' | i18n }}</label>
    <pry-select
      class="a-pry-select"
      id="type"
      formControlName="type"
      [items]="datasetTypes"
      [itemsAsOption]="true"
      bindValue="value"
      bindLabel="label"
      [isForm]="true"
      [labelTranslate]="true"
      aria-labelledby="user-label"
    ></pry-select>
  </div>

  <label class="a-label a-label--help -error" *ngIf="isSameName">{{ '@pry.admin.dataset.is-same-name' | i18n }}</label>

  <div class="m-btn-group -width-sm">
    <button
      type="button"
      class="a-btn a-btn--secondary"
      (click)="goBack()"
      [innerHTML]="'@pry.admin.cancel' | i18n"
    ></button>
    <button
      class="a-btn a-btn--primary"
      type="submit"
      [innerHTML]="(dataset$ ? '@pry.admin.edit' : '@pry.admin.create') | i18n"
    ></button>
  </div>
</form>
