<ng-container *ngIf="action">
  <ul>
    <li class="m-actions-list__item">
      <button
        class="a-btn a-btn--secondary"
        [class.is-active]="panelOpen"
        (click)="select(action)"
        [disabled]="action.disabled"
        cdkOverlayOrigin
        #origin="cdkOverlayOrigin"
      >
        <ng-container *ngIf="!iconAction; else iconActionTpl">
          <pry-icon *ngIf="action.icon" [iconSvg]="action.icon" [height]="20" [width]="20"></pry-icon>
          {{ baseToolboxTranslation + action.label | i18n }}
          <pry-icon *ngIf="action.actions" iconSvg="fleche_bas"></pry-icon>
        </ng-container>
        <ng-template #iconActionTpl>
          <pry-icon
            *ngIf="action.icon"
            [iconSvg]="action.icon"
            [title]="baseToolboxTranslation + action.label | i18n"
          ></pry-icon>
        </ng-template>
      </button>
    </li>
  </ul>
  <ng-template
    cdkConnectedOverlay
    cdkConnectedOverlayHasBackdrop
    cdkConnectedOverlayLockPosition
    cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
    [cdkConnectedOverlayOrigin]="origin"
    [cdkConnectedOverlayOpen]="panelOpen"
    [cdkConnectedOverlayPositions]="connectedPositions"
    (backdropClick)="onClosePanel()"
  >
    <div class="m-pry-overlay-panel-wrapper">
      <div class="m-pry-overlay-panel">
        <ng-container *ngFor="let act of action.actions">
          <button class="m-pry-overlay-panel-item" (click)="select(act)">
            {{ baseToolboxTranslation + act.label | i18n }}
          </button>
        </ng-container>
      </div>
    </div>
  </ng-template>
</ng-container>
