<nav class="m-nav-links">
  <ng-container *ngFor="let sub of subMenu$ | async">
    <ul class="m-nav-links__list">
      <ng-container *ngFor="let menu of sub.subMenus">
        <li
          *pryAccess="{ module: menu.module, page: menu.page, subMenu: menu.subMenu }"
          class="m-nav-links__list__item"
        >
          <a [routerLink]="menu.menu" class="a-btn a-btn--secondary -width-full" [routerLinkActive]="'is-active'">
            {{ baseMenuTranslation + menu.menu | i18n }}
          </a>
        </li>
      </ng-container>
    </ul>
  </ng-container>
</nav>
