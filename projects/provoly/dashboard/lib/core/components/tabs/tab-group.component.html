<div class="o-tabs">
  <div class="o-tabs__list" role="tablist" [attr.aria-label]="'tab-panel-' + instanceId">
    @for (tab of tabs; track tab; let index = $index) {
      <button
        type="button"
        class="o-tabs__list__btn"
        role="tab"
        [id]="'tab-' + instanceId + '-' + index"
        [attr.aria-selected]="index === currentTabIndex"
        [attr.tabindex]="index === currentTabIndex ? 0 : -1"
        [attr.aria-controls]="'tabpanel-' + instanceId + '-' + index"
        (click)="switch(tab, index)"
        >
        {{ translationStringBase + tab.name | i18n }}
      </button>
    }
  </div>
  <div
    class="o-tabs__panel"
    [id]="'tabpanel-' + instanceId + '-' + currentTabIndex"
    role="tabpanel"
    [attr.aria-labelledby]="'tab-' + instanceId + '-' + currentTabIndex"
    >
    <div class="o-tabs__panel__content">
      <ng-template [ngTemplateOutlet]="currentTab.templateRef"></ng-template>
    </div>
  </div>
</div>
