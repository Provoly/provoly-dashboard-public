@if (mode !== 'action') {
  <label
    class="a-toggle a-tooltip"
    [for]="'toggle-' + _id"
    [dir]="dir"
    [ngClass]="{
      '-disabled': disabled,
      '-always-active': alwaysActive,
      '-size-sm': size === 'sm',
      '-txt-inside': hasTextInside
    }"
    [attr.data-tooltip]="'@pry.toolbox.edit' | i18n"
    data-tooltip-position="bottom"
    >
    <input
      #input
      type="checkbox"
      name="toggle"
      [id]="'toggle-' + _id"
      class="a-toggle__input"
      [checked]="checked"
      [disabled]="disabled"
      (change)="onChangeValue($event)"
      (click)="onInputClick($event)"
      />
    <ng-container *ngTemplateOutlet="contentTpl"></ng-container>
  </label>
}
@if (mode === 'action') {
  <button
    type="button"
    class="a-toggle"
    [dir]="dir"
    [ngClass]="{
      '-disabled': disabled,
      '-always-active': alwaysActive,
      '-size-sm': size === 'sm',
      '-txt-inside': hasTextInside
    }"
    [attr.aria-pressed]="checked"
    [disabled]="disabled"
    (change)="onChangeValue($event)"
    (click)="onInputClick($event)"
    #button
    >
    <ng-container *ngTemplateOutlet="contentTpl"></ng-container>
  </button>
}

<ng-template #contentTpl>
  <span class="a-toggle__display" aria-hidden="true">
    <span class="a-toggle__display__txtleft">{{ leftword }}</span>
    <span class="a-toggle__display__txtright">{{ rightword }}</span>
  </span>
  <span class="a-toggle__wording">
    <ng-content></ng-content>
  </span>
</ng-template>
