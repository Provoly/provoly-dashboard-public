<div class="o-about">
  <div class="m-info-icon">
    <span>i</span>
  </div>
  <div class="o-about__tooltip -position-{{ tooltipPosition }}">
    @for (version of (version$ | async) ?? {} | keyvalue; track version.key) {
      <div class="o-about__line">
        {{ '@pry.about.' + version.key | i18n }}
        <p class="a-chip -md -no-wrap" [class.-not-found]="!hasVersion(version.value)">
          {{ displayVersion(version.value) }}
        </p>
      </div>
    }
  </div>
</div>
