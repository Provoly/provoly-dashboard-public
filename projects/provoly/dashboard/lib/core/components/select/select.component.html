<div
  class="a-pry-select"
  [attr.aria-disabled]="disabled"
  #selectElement
  [class.-focused]="focused"
  (click)="handleClick()"
  role="combobox"
  [attr.aria-expanded]="open"
  [attr.aria-owns]="open ? modalId : null"
  aria-haspopup="listbox"
  tabindex="0"
  cdkMonitorElementFocus
  (cdkFocusChange)="onFocusChange($event)"
  (keydown)="onKeydownSelect($event)"
>
  <div class="a-pry-select__content">
    <ng-container *ngIf="autocomplete; else noAutocomplete">
      <input
        type="text"
        class="a-pry-select__search"
        [ngModel]="search$.getValue()"
        (ngModelChange)="search($event)"
        aria-autocomplete="list"
        [attr.aria-controls]="open ? modalId : null"
        [attr.aria-disabled]="disabled"
        [disabled]="disabled"
        (keydown)="onKeydownAutocompleteInput($event)"
        #input
      />
    </ng-container>
    <ng-template #noAutocomplete>
      <ng-container *ngIf="(valueItems$ | async).length === 0; else selectedValues">
        <span class="a-pry-select__placeholder">{{ placeholder }}</span>
      </ng-container>
      <ng-template #selectedValues>
        <ng-container *ngFor="let item of valueItems$ | async">
          <div
            class="a-pry-select__value"
            [class.pry-select-form]="isForm"
            [class.-multiple]="multiple"
            [ngClass]="item ? item[bindClasses ?? ''] ?? {} : {}"
          >
            <ng-container *ngIf="template; else noTemplateLabel">
              <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ item, clear }"></ng-container>
            </ng-container>
            <ng-template #noTemplateLabel>
              <pry-icon
                *ngIf="bindIcon"
                [iconSvg]="item[bindIcon]"
                [width]="iconSize[0]"
                [height]="iconSize[1]"
              ></pry-icon>
              <ng-container *ngIf="bindLabel ? item?.[bindLabel] : item as value">
                {{ (i18nPrefix ?? '') + value | i18n : { warn: false } }}
                <span
                  *ngIf="multiple && clearable"
                  class="a-pry-select__clear"
                  (click)="clear($event, item)"
                  aria-hidden="true"
                  >×</span
                >
              </ng-container>
            </ng-template>
          </div>
        </ng-container>
      </ng-template>
      <div class="a-pry-select__filler"></div>
    </ng-template>
  </div>
  <div class="a-pry-select__actions">
    <span *ngIf="clearable" class="a-pry-select__clear" (click)="clearAll($event)" aria-hidden="true">×</span>
    <pry-icon
      class="a-pry-select__toggle"
      [iconSvg]="open ? 'chevron_top' : 'chevron_bottom'"
      [width]="iconSize[0]"
      [height]="iconSize[1]"
    ></pry-icon>
  </div>
</div>
<ng-template #optionsModal>
  <div
    role="listbox"
    [attr.aria-label]="'@pry.select.label' | i18n"
    [id]="modalId"
    [attr.aria-activedescendant]="'select-option-' + activeDescendant"
    [attr.aria-multiselectable]="multiple"
    [attr.required]="required"
    [attr.aria-readonly]="readonly"
    cdkTrapFocus="!autocomplete"
    [cdkTrapFocusAutoCapture]="!autocomplete"
  >
    <div class="a-pry-select__options__option -hint" *ngIf="loading" [style.width.px]="modalWidth">
      <div class="no-widget no-widget__loader">
        <pry-icon
          iconSvg="loader"
          class="no-widget__loading"
          [alt]="'@pry.widget.target.loading' | i18n"
          [width]="30"
          [height]="30"
          *ngIf="loading"
        />
      </div>
      <p>{{ '@pry.select.loading' | i18n }}...</p>
    </div>
    <ng-container *ngIf="!loading">
      <ng-container *ngFor="let item of matchingItems$ | async; let index = index; let first = first; let last = last">
        <div
          class="a-pry-select__options__option"
          [attr.aria-selected]="(valueItems$ | async).includes(item)"
          [attr.aria-checked]="(valueItems$ | async).includes(item)"
          [attr.aria-disabled]="disabled"
          (click)="select($event, item, index)"
          (keydown)="onKeydownOption($event, item, index, optionDivRef, first, last)"
          [style.width.px]="modalWidth"
          role="option"
          [id]="'select-option-' + index"
          tabindex="0"
          #optionDivRef
        >
          <ng-container *ngIf="template; else noTemplate">
            <ng-container [ngTemplateOutlet]="template" [ngTemplateOutletContext]="{ item, clear }"></ng-container>
          </ng-container>
          <ng-template #noTemplate>
            <pry-checkbox (click)="$event.preventDefault()" *ngIf="multiple" [ngModel]="(valueItems$ | async).includes(item)"></pry-checkbox>
            <pry-icon
              *ngIf="bindIcon"
              [iconSvg]="item[bindIcon]"
              [width]="iconSize[0]"
              [height]="iconSize[1]"
            ></pry-icon>
            <ng-container *ngIf="bindLabel ? item?.[bindLabel] : item as value">
              {{ (i18nPrefix ? i18nPrefix : '') + value | i18n : { warn: false } }}
            </ng-container>
          </ng-template>
        </div>
      </ng-container>
    </ng-container>
  </div>
</ng-template>
