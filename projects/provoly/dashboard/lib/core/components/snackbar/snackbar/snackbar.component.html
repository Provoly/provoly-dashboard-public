@if (!hiddenFromAction) {
  <div
    class="m-snackbar -bottom"
    [ngClass]="typeClass"
    [@panelState]="{ value: 'visible', params: { transform: transformOptions, transition: transitionOptions } }"
    [style.bottom.px]="listIndex * 60"
    >
    <div class="m-snackbar__content">
      <pry-icon [iconSvg]="icon"></pry-icon>
      <p class="a-p">{{ data.message }}</p>
      @if (!!data.action) {
        <button class="m-snackbar__action" (click)="actionClick()">{{ data.action }}</button>
      }
    </div>
  </div>
}
