<div class="o-base-layout__toolbox__actions">
  <ul class="m-actions-list">
    @for (action of actions$ | async; track action) {
      <pry-base-toolbox-action
        *pryAccess="{ module: action.moduleAccess, page: action.pageAccess, action: action.actionAccess }"
        [action]="action"
        [baseToolboxTranslation]="baseToolboxTranslation"
        >
      </pry-base-toolbox-action>
    }
  </ul>

  <ul class="m-actions-list">
    @for (action of subActions$ | async; track action) {
      <pry-base-toolbox-action
        *pryAccess="{ module: action.moduleAccess, page: action.pageAccess, action: action.actionAccess }"
        [action]="action"
        [baseToolboxTranslation]="baseToolboxTranslation"
        [iconAction]="true"
        >
      </pry-base-toolbox-action>
    }
  </ul>
</div>
