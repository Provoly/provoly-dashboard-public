<div class="m-form-label-field">
  <label class="a-label" for="share_type">{{ '@pry.share.type' | i18n }}</label>
  <pry-select
    (ngModelChange)="onChange($event)"
    [items]="visibilityTypes"
    [ngModel]="stringValue"
    [disabled]="_disabled"
    i18nPrefix="@pry.share.radioLabel."
    bindValue="name"
    bindLabel="name"
    bindIcon="icon"
    id="share_type"
    [iconSize]="[21, 18]"
  ></pry-select>
</div>
