<div class="m-form-label-field">
  <label class="a-label" for="share_type">{{ '@pry.share.type' | i18n }}</label>
  <pry-select
    (ngModelChange)="writeValueType($event)"
    [items]="visibilityTypes"
    [ngModel]="value?.type"
    [disabled]="_disabled"
    i18nPrefix="@pry.share."
    bindValue="value"
    bindLabel="label"
    id="share_type"
    bindIcon="icon"
    [iconSize]="[21, 18]"
  ></pry-select>
</div>

<ng-container *ngIf="value?.type === PryVisibilityType.RESTRICTED">
  <div class="m-form-label-field">
    <label class="a-label" for="users">{{ '@pry.share.users' | i18n }}</label>
    <pry-select
      (ngModelChange)="writeValueUsers($event)"
      [items]="users$ | async"
      [multiple]="true"
      [closeOnSelect]="false"
      [ngModel]="value?.users"
      [disabled]="_disabled"
      [bindLabel]="labelProperty"
      [bindValue]="valueProperty"
      [autocomplete]="true"
      id="users"
    ></pry-select>
  </div>
</ng-container>
