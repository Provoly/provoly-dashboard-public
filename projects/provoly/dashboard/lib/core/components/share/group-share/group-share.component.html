@if (templateData$ | async; as data) {
  <div class="m-form-radio-group">
    <div *ngFor="let type of shareModes" class="m-form-radio-group__item">
      <input
        type="radio"
        name="visibility"
        [id]="type.label"
        [value]="type.value"
        [ngModel]="radioValue"
        (ngModelChange)="changeGroupsBasedOnRadioValue($event)"
        [disabled]="data.disableRadios[type.value]"
      />
      <label [for]="type.label" class="a-label" [class.a-label--disabled]="data.disableRadios[type.value]">
        {{ '@pry.share.' + type.label | i18n }}
      </label>
    </div>
  </div>
  @if (radioValue === PryShareMode.GROUPS) {
    @if (data.groups.length > 0) {
      <pry-chips-selector
        bindLabel="name"
        bindValue="name"
        translationStringBase="@pry.components.chipsSelector.share."
        itemTranslationStringBase="@pry.components.chipsSelector.share.groups."
        [showActionButtons]="false"
        [items]="data.groups"
        (itemsChanged)="changeGroups($event)"
        [usedItems]="data.assignedGroups"
        [showSearchbar]="data.groups.length > 6"
      ></pry-chips-selector>
    } @else {
      <p class="m-text--center">
        {{ '@pry.share.noGroups' | i18n }}
      </p>
    }
  }
}
