<div class="m-form-radio-group">
  <div *ngFor="let type of visibilityTypes" class="m-form-radio-group__item">
    <input
      type="radio"
      name="visibility"
      [id]="type.label"
      [value]="type.value"
      [ngModel]="radioValue"
      (ngModelChange)="changeGroupsBasedOnRadioValue($event)"
      [disabled]="_disabled"
    />
    <label [for]="type.label" class="a-label">{{ '@pry.share.' + type.label | i18n }}</label>
  </div>
</div>

<ng-container *ngIf="radioValue === PryVisibilityType.RESTRICTED">
  <pry-chips-selector
    bindLabel="name"
    bindValue="name"
    translationStringBase="@pry.components.chipsSelector.share."
    itemTranslationStringBase="@pry.components.chipsSelector.share.groups."
    [showActionButtons]="false"
    [items]="(groups$ | async) ?? []"
    (itemsChanged)="changeGroups($event)"
    [usedItems]="(assignedGroups$ | async) ?? []"
  ></pry-chips-selector>
</ng-container>
