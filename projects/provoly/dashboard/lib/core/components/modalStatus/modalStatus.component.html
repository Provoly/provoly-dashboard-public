<div class="o-modal-wrapper">
  <div class="o-modal__top">
    <div class="o-modal__top__title">
      <h2 class="a-h2">{{ '@pry.dataset.error.title' | i18n }}</h2>
    </div>
    <div class="o-modal__top__close">
      <button class="a-btn a-btn--icon-only" (click)="goBack()">
        <pry-icon iconSvg="close" [height]="35" [width]="35"></pry-icon>
        <span class="u-visually-hidden">{{ '@pry.toolbox.close' | i18n }}</span>
      </button>
    </div>
  </div>
  <table class="a-table">
    <thead>
      <tr>
        <th>{{ '@pry.dataset.error.code' | i18n }}</th>
        <th>{{ '@pry.dataset.error.elements' | i18n }}</th>
        <th>{{ '@pry.dataset.error.message' | i18n }}</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let error of datasetErrors$ | async | slice : 0 : 5">
        <td>
          {{ error.code }}
        </td>
        <td>
          {{ error.line }}
        </td>
        <td>
          {{ error.message }}
        </td>
      </tr>
    </tbody>
  </table>
</div>
