<pry-filter-group-css></pry-filter-group-css>
<ng-container *ngIf="globalManifest$ | async as manifest">
  <div class="o-container__filters" *ngIf="manifest.filters && manifest.filters.length > 0">
    <div class="o-container__filter-container" (click)="openSelect()">
      @for (filterDescription of manifest.filters; track filterDescription.id) {
        <pry-filter-instanciator
          [filter]="filterDescription"
          [applyFilter$]="apply$"
          (pressedEnter)="enterPressed()"
          (cleared)="cleared()"
        ></pry-filter-instanciator>
      }
    </div>
    <div class="o-container__filter-actions">
      <button type="button" class="a-btn a-btn--icon-only" (click)="clearFilters()">
        <pry-icon iconSvg="clear_filter" [width]="30" [height]="30"></pry-icon>
      </button>
      <button type="button" class="a-btn a-btn--primary" (click)="filter()">
        {{ '@pry.toolbox.apply' | i18n }}
        <pry-icon iconSvg="refresh_filter" [width]="18" [height]="18"></pry-icon>
      </button>
    </div>
  </div>
</ng-container>
