<button type="button" (click)="toggle()" class="a-btn a-btn--icon-text -settings">
  <pry-icon [height]="20" [width]="20" iconSvg="control"></pry-icon>
  <span>{{ '@pry.widget.settings.title' | i18n }}</span>
</button>

<ng-template #template>
  <div class="o-settings__popup" role="dialog" aria-modal="true" aria-labelledby="dialog_setting">
    <div class="o-settings__popup__header">
      <h2 class="a-h2">{{ '@pry.widget.settings.title' | i18n }}</h2>
      <button
        type="button"
        #cross
        (keydown.shift.tab)="focusElement(this.validate)"
        (click)="toggle()"
        class="a-btn a-btn--icon-only -close"
      >
        <pry-icon iconSvg="close"></pry-icon>
        <span class="u-visually-hidden">{{ '@pry.action.close' | i18n }}</span>
      </button>
    </div>

    <div class="o-settings__popup__content" (click)="this.triggerClick.next()">
      <div class="m-form-label-field">
        <label class="a-label" for="widget_title">{{ '@pry.widget.settings.changeTitle' | i18n }} :</label>
        <input
          class="a-form-field"
          id="widget_title"
          type="text"
          [value]="manifest?.title ?? ''"
          (input)="emitTitle($event)"
        />
      </div>
      <ng-content></ng-content>
    </div>

    <div class="o-settings__popup__footer">
      <button
        (click)="saveAndClose()"
        [class.btn-primary__disable]="isDisable"
        [disabled]="isDisable"
        (keydown.tab)="focusElement(this.cross)"
        class="a-btn a-btn--primary"
        #validate
      >
        {{ '@pry.widget.settings.validateUpdating' | i18n }}
      </button>
    </div>
  </div>
</ng-template>
