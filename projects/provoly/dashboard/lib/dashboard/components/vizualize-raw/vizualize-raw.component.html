@if (rawDatas[item?.id + '@' + propertyName]; as rawData) {
  @if (rawData.type.includes('image')) {
    <img [src]="rawData.url" [alt]="altValue" />
  }
  @if (rawData.type.includes('video')) {
    <video [preload]="true" class="preview" controls>
      <source [src]="rawData.url" [type]="rawData.type" />
    </video>
  }
}
@if (!rawDatas[item?.id + '@' + propertyName]) {
  @if (getRawData(item?.id ?? '', propertyName) | async) {
    Downloading...
  }
}
