<pry-restitution-css></pry-restitution-css>
<div class="o-catalog">
  <ng-template [ngIf]="selectedMode === mode.CATALOG">
    <h2 class="a-h2">{{ '@pry.restitution.catalog' | i18n }}</h2>
    <div class="o-catalog__filters">
      <div class="o-catalog__filters__by-name">
        <label id="catalog-search-label" for="catalog-search" class="a-label u-visually-hidden">
          <span>{{ '@pry.toolbox.catalog.filter.name' | i18n }}</span>
        </label>
        <pry-icon iconSvg="search" [width]="17" [height]="17"></pry-icon>
        <input
          id="catalog-search"
          type="text"
          class="a-form-field"
          [placeholder]="'@pry.action.search' | i18n"
          [ngModel]="search$ | async"
          (ngModelChange)="this.search$.next($event)"
        />
      </div>
      <label class="a-label">{{ '@pry.action.filterByType' | i18n }}</label>
      <div class="o-catalog__filters__by-type">
        <ul class="o-catalog__filters__by-type__list">
          <li *ngFor="let typeOpt of types$ | async">
            <input
              type="radio"
              class="a-form-field u-sr-only"
              name="catalog-filter"
              id="catalog-button-{{ typeOpt.type }}"
              [checked]="typeOpt.type === (type$ | async)"
              (change)="type$.next(typeOpt.type)"
            />
            <label
              class="a-label"
              id="catalog-button-label-{{ typeOpt.type }}"
              for="catalog-button-{{ typeOpt.type }}"
              [title]="typeOpt.label | i18n"
            >
              <span class="u-sr-only">{{ typeOpt.label | i18n }} </span>
              <pry-icon [width]="18" [height]="18" [iconSvg]="typeOpt.icon"></pry-icon>
            </label>
          </li>
        </ul>
        <button
          type="button"
          class="a-btn a-btn--icon-text -link-like"
          (click)="type$.next(undefined)"
          [disabled]="!type$.getValue()"
          [class.u-visually-hidden]="!type$.getValue()"
        >
          <pry-icon [width]="15" [height]="15" iconSvg="delete"></pry-icon>
          {{ '@pry.toolbox.catalog.filter.delete' | i18n }}
        </button>
      </div>
    </div>
    <ng-container *ngIf="showTabs; else list">
      <div class="o-accordion" role="tablist" aria-multiselectable="false">
        <ng-container *ngFor="let category of categories">
          <h2 class="o-accordion__title" [class.is-active]="categoryOpened === category">
            <button
              type="button"
              class="o-accordion__title__btn"
              [id]="'button_' + category"
              role="tab"
              [attr.aria-controls]="'panel_' + category"
              [attr.aria-selected]="categoryOpened === category"
              [attr.aria-expanded]="categoryOpened === category"
              (click)="toggle(category)"
            >
              <span>
                {{ '@pry.restitution.catalogTabs.' + category | i18n }}
                ({{ category === 'model' ? (nonCustomWidgets$ | async)?.length : (customWidgets$ | async)?.length }})
              </span>
              <pry-icon
                [width]="15"
                [height]="15"
                [iconSvg]="categoryOpened === category ? 'chevron_top_rounded' : 'chevron_bottom_rounded'"
              ></pry-icon>
            </button>
          </h2>
          <div
            class="o-accordion__panel"
            role="tabpanel"
            [attr.aria-labelledby]="'button_' + category"
            [id]="'panel_' + category"
            [attr.aria-hidden]="categoryOpened !== category"
          >
            <ng-container *ngIf="categoryOpened === category">
              <ul class="o-catalog__list" role="list" aria-live="polite">
                <ng-container *ngIf="categoryOpened === 'model'">
                  <pry-catalog-item
                    *ngFor="let widget of nonCustomWidgets$ | async"
                    [widget]="widget"
                    (selectRestitution)="selectRestitution($event)"
                  ></pry-catalog-item>
                </ng-container>
                <ng-container *ngIf="categoryOpened === 'noModel'">
                  <pry-catalog-item
                    *ngFor="let widget of customWidgets$ | async"
                    [widget]="widget"
                    (selectRestitution)="selectRestitution($event)"
                  ></pry-catalog-item>
                </ng-container>
              </ul>
            </ng-container>
          </div>
        </ng-container>
      </div>
    </ng-container>

    <ng-template #list>
      <ul class="o-catalog__list" role="list" aria-live="polite">
        <pry-catalog-item
          *ngFor="let widget of filteredWidgets$ | async"
          [widget]="widget"
          (selectRestitution)="selectRestitution($event)"
        ></pry-catalog-item>
      </ul>
    </ng-template>
  </ng-template>

  <ng-template [ngIf]="selectedMode === mode.CONSULT">
    <div class="o-catalog__create">
      <button class="a-btn a-btn--secondary" (click)="closeRestitution()">
        {{ '@pry.restitution.cancel' | i18n }}
      </button>
    </div>

    <pry-restitution
      [selectedRestitution]="selectedRestitution"
      [edit]="false"
      (restitutionCreated)="closeRestitution()"
    ></pry-restitution>
  </ng-template>

  <ng-template [ngIf]="selectedMode === mode.CREATION">
    <div class="o-catalog__create">
      <button class="a-btn a-btn--ghost" (click)="selectMode(mode.CATALOG)">
        {{ '@pry.restitution.cancel' | i18n }}
      </button>
    </div>

    <pry-restitution (restitutionCreated)="closeRestitution()"></pry-restitution>
  </ng-template>
</div>
