<pry-restitution-css></pry-restitution-css>
<div class="o-manifest-layout o-restitution-catalog">
  <ng-template [ngIf]="selectedMode === mode.CATALOG">
    <div class="o-manifest-layout__toolbox">
      <button
        type="button"
        (click)="selectMode(mode.CREATION)"
        class="a-btn a-btn--primary a-tooltip"
        [attr.data-tooltip]="'@pry.restitution.create_title' | i18n"
        *pryAccess="{ module: 'dashboard', page: 'restitution', action: 'create' }"
      >
        {{ '@pry.restitution.create_title' | i18n }}
      </button>
      <div>
        <div class="o-catalog__search">
          <label id="catalog-search-label" for="catalog-search" class="u-visually-hidden">
            <span>{{ '@pry.toolbox.catalog.filter.name' | i18n }}</span>
          </label>
          <input
            id="catalog-search"
            type="text"
            class="a-form-field"
            [placeholder]="'@pry.restitution.search' | i18n"
            [ngModel]="search$ | async"
            (ngModelChange)="this.search$.next($event)"
          />

          <pry-icon iconSvg="search" [width]="17" [height]="17"></pry-icon>
        </div>
      </div>
    </div>
    <div class="o-manifest-layout__content">
      <h1 class="a-h1">{{ '@pry.restitution.catalog' | i18n }}</h1>

      <div class="o-presentation-wrapper">
        <ul class="o-presentation">
          <li class="o-presentation__item" *ngFor="let restitution of filteredRestitution$ | async">
            <div class="o-presentation__item__header">
              <ng-container *ngIf="restitution.visibility?.type === PryVisibilityType.PRIVATE">
                <pry-icon
                  iconSvg="private"
                  class="is-private a-tooltip"
                  [attr.data-tooltip]="'@pry.restitution.lock' | i18n"
                  [height]="17"
                  [width]="17"
                ></pry-icon>
              </ng-container>
              <div class="a-tooltip" [attr.data-tooltip]="'@pry.presentation.view' | i18n">
                <div class="o-presentation__item__image">
                  <img
                    alt=""
                    [height]="restitution.cover ? 600 : 128"
                    [width]="restitution.cover ? 600 : 128"
                    [class.is-full-width]="restitution.cover"
                    [src]="restitution.image | getSecuredImage : [600, 600] | async"
                    class="pointer"
                    (click)="selectRestitution(restitution)"
                  />
                </div>
              </div>
            </div>

            <div class="o-presentation__item__txt">
              <h3 class="a-h3">{{ restitution.name }}</h3>
              <p class="a-p -date">{{ restitution.modificationDate | sinceDate }}</p>
            </div>

            <div class="o-presentation__item__footer">
              <ul class="m-actions-list">
                <li>
                  <button
                    type="button"
                    class="a-btn a-btn icon-only a-tooltip"
                    [attr.data-tooltip]="'@pry.restitution.consult' | i18n"
                    (click)="selectRestitution(restitution)"
                    *pryAccess="{ module: 'dashboard', page: 'restitution', action: 'consult' }"
                  >
                    <pry-icon iconSvg="eye"></pry-icon>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="a-btn a-btn icon-only a-tooltip"
                    [attr.data-tooltip]="'@pry.restitution.update' | i18n"
                    (click)="editRestitution(restitution)"
                    [disabled]="!restitution.owner"
                    *pryAccess="{ module: 'dashboard', page: 'restitution', action: 'edit' }"
                  >
                    <pry-icon iconSvg="edit"></pry-icon>
                  </button>
                </li>
                <li>
                  <button
                    type="button"
                    class="a-btn a-btn icon-only a-tooltip"
                    [attr.data-tooltip]="'@pry.restitution.delete' | i18n"
                    (click)="deleteRestitution(restitution.id)"
                    [disabled]="!restitution.owner"
                    *pryAccess="{ module: 'dashboard', page: 'restitution', action: 'delete' }"
                  >
                    <pry-icon iconSvg="delete"></pry-icon>
                  </button>
                </li>
              </ul>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </ng-template>

  <ng-template [ngIf]="selectedMode === mode.CONSULT">
    <div class="o-manifest-layout__toolbox">
      <button type="button" (click)="selectMode(mode.CATALOG)" class="a-btn a-btn--primary">
        {{ '@pry.restitution.backToCatalog' | i18n }}
      </button>
    </div>
    <div class="o-manifest-layout__content">
      <pry-restitution
        [selectedRestitution]="selectedRestitution"
        [edit]="false"
        (restitutionCreated)="closeRestitution($event)"
        class="restitution"
      ></pry-restitution>
    </div>
  </ng-template>
  <ng-template [ngIf]="selectedMode === mode.CREATION">
    <div class="o-manifest-layout__toolbox">
      <button type="button" (click)="selectMode(mode.CATALOG)" class="a-btn a-btn--primary">
        {{ '@pry.restitution.backToCatalog' | i18n }}
      </button>
    </div>
    <div class="o-manifest-layout__content">
      <pry-restitution (restitutionCreated)="closeRestitution($event)" class="restitution"></pry-restitution>
    </div>
  </ng-template>
  <ng-template [ngIf]="selectedMode === mode.EDITION">
    <div class="o-manifest-layout__toolbox">
      <button type="button" (click)="selectMode(mode.CATALOG)" class="a-btn a-btn--primary">
        {{ '@pry.restitution.backToCatalog' | i18n }}
      </button>
    </div>
    <div class="o-manifest-layout__content">
      <pry-restitution
        (restitutionCreated)="closeRestitution($event)"
        [selectedRestitution]="selectedRestitution"
        class="restitution"
      ></pry-restitution>
    </div>
  </ng-template>
</div>
