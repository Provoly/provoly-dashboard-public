<form class="o-dataset-version-form u-display-flex -column" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="m-form-label-field">
    <label class="a-label" for="productionDate">{{ '@pry.dataset.version.productionDate' | i18n }}</label>
    <input
      class="a-form-field"
      type="datetime-local"
      [max]="maxDate"
      formControlName="productionDate"
      id="productionDate"
      [attr.aria-invalid]="productionDate?.invalid"
      />
    @if (productionDate?.invalid) {
      <label id="productionDate-error" for="productionDate" class="a-label a-label--help -error">
        @if (productionDate?.errors?.['required']) {
          <span>{{ '@pry.dataset.form.obligatory' | i18n }}</span>
        } @else if (productionDate?.errors?.['dateValidator']) {
          <span>{{ '@pry.dataset.form.date' | i18n }}</span>
        }
      </label>
    }
  </div>
  <div class="m-form-label-field">
    <label class="a-label">{{ '@pry.dataset.version.producer' | i18n }}</label>
    <input
      class="a-form-field"
      type="text"
      formControlName="producer"
      id="producer"
      [attr.aria-invalid]="producer?.invalid"
      />
    @if (producer?.invalid) {
      <label id="producer-error" for="producer" class="a-label a-label--help -error">
        @if (producer?.errors?.['required'] ?? false) {
          <span>{{ '@pry.dataset.form.obligatory' | i18n }}</span>
        }
      </label>
    }
  </div>
  <div class="m-form-label-field">
    <label class="a-label">{{ '@pry.dataset.version.additionalInformation' | i18n }}</label>
    <pry-text-editor formControlName="additionalInformation"></pry-text-editor>
  </div>
  <button class="a-btn a-btn--primary u-self-end" type="submit" [disabled]="form.invalid">
    {{ '@pry.toolbox.manifest.validate' | i18n }}
  </button>
</form>
