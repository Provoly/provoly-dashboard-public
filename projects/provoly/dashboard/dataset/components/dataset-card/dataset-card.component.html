<pry-dataset-css></pry-dataset-css>
<div class="o-pry-dataset-card">
  <div class="o-pry-dataset-card__header">
    <img
      alt=""
      [height]="25"
      [width]="25"
      [src]="dataset.id | translateId: { type: 'datasource', output: 'icon' } | async"
    />
    <div class="a-h4 dataset-name">{{ dataset.name }}</div>
  </div>
  <div class="o-pry-dataset-card__txt">
    <div class="a-p">
      <p class="a-p -date">{{'@pry.dataset.since_day' |i18n}} {{ ((activeVersion$ | async)! | sinceDate )}}</p>
      <div class="description-container">
        <span class="description">{{ truncateDescription(dataset.description, 100) }}</span>
        <div class="description-tooltip">{{ truncateDescription(dataset.description, 100) }}</div>
      </div>
    </div>
  </div>

  <div class="o-pry-dataset-card__content"></div>
  <div class="o-pry-dataset-card__footer">
    <button class="a-btn" (click)="goToDetailView()">
      <pry-icon iconSvg="table"></pry-icon>
      {{ '@pry.dataset.table' | i18n }}
    </button>
    <button class="a-btn" disabled>
      <pry-icon iconSvg="download"></pry-icon>
      {{ '@pry.dataset.export' | i18n }}
    </button>
    <button class="a-btn" disabled>
      {{ '@pry.dataset.api' | i18n }}
    </button>
  </div>
  <div class="o-pry-dataset-card__button">
    <button class="a-btn" (click)="goToDetailView()">{{ '@pry.dataset.consult' | i18n }}</button>
  </div>
</div>
