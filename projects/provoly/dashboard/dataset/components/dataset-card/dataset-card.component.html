<pry-dataset-css></pry-dataset-css>
<div class="o-pry-dataset-card" (click)="goToDetailView()">
  <div class="o-pry-dataset-card__header">
    <img
      alt=""
      [height]="25"
      [width]="25"
      [src]="dataset.id | translateId: { type: 'datasource', output: 'icon' } | async"
    />
    <div class="a-h4 dataset-name" ellipsis textElementSelector=".a-h4">
      <h4 class="a-h4">{{ dataset.name }}</h4>
    </div>
  </div>
  <div class="o-pry-dataset-card__txt">
    <div class="a-p">
      <ng-container *ngIf="activeVersion$ | async; else noActiveVersion">
        <p class="a-p -date">{{ '@pry.dataset.since_day' | i18n }} {{ (activeVersion$ | async)! | sinceDate }}</p>
      </ng-container>
      <ng-template #noActiveVersion>
        <span> {{ '@pry.dataset.noActiveVersion' | i18n }}</span>
      </ng-template>
      <div class="o-pry-dataset-card__description-container" ellipsis textElementSelector=".description">
        <div class="description">{{ truncateDescription(dataset.description, 100) }}</div>
      </div>
    </div>
  </div>

  <div class="o-pry-dataset-card__footer">
    <button class="a-btn">
      {{ '@pry.dataset.consult' | i18n }}
      <pry-icon [width]="20" [height]="20" iconSvg="arrow_right"></pry-icon>
    </button>
  </div>
</div>
