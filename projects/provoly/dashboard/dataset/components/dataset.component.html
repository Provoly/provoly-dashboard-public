<pry-dataset-css></pry-dataset-css>
<div class="o-dataset-layout u-display-flex -column">
  @switch (selectedMode) {
    @case (ViewMode.CATALOG) {
      <h1 class="a-h1 u-self-start">{{ '@pry.dataset.title' | i18n }}</h1>
      <pry-datasource-list (consultedDataset)="consult($event)"></pry-datasource-list>
    }
    @case (ViewMode.CONSULT) {
      @if (selectedDataset) {
        <pry-dataset-detail
          [dataset]="selectedDataset"
          (goToCatalog)="selectedMode = ViewMode.CATALOG"
        ></pry-dataset-detail>
      }
    }
  }
</div>
