<div
  *ngIf="currentIntegrationError$ | async as e"
  [id]="'panel-env-' + (e.oClass | translateId : { type: 'class', output: 'name' } | async)"
  [attr.aria-labelledby]="'button-env-' + (e.oClass | translateId : { type: 'class', output: 'name' } | async)"
  class="o-panel"
>
  <div class="o-panel__header">
    <button type="button" class="a-btn a-btn--icon-only" (click)="closePanel()">
      <span class="u-visually-hidden">{{ '@pry.action.closePanel' | i18n }}</span>
      <pry-icon iconSvg="close"></pry-icon>
    </button>
    <h3 [id]="'tab-title-' + (e.oClass | translateId : { type: 'class', output: 'name' } | async)" class="a-h3">
      {{ '@pry.supervision.importErrors.details.title' | i18n }}
    </h3>
  </div>

  <pry-tab-group translationStringBase="@pry.supervision.importErrors.details.">
    <pry-tab [templateRef]="errorDetails" name="details"></pry-tab>
  </pry-tab-group>
  <ng-template #errorDetails>
    <div *ngFor="let error of e.errors">
      <p class="a-p">
        {{ '@pry.supervision.importErrors.details.errorLabel' | i18n }} :
        <strong>{{ error.label }}</strong>
      </p>
      <p class="a-p">
        {{ '@pry.supervision.importErrors.details.errorCount' | i18n }}:
        <strong>{{ error.count }}</strong>
      </p>
    </div>
  </ng-template>
</div>
