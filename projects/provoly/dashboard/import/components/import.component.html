<pry-import-css></pry-import-css>
<div class="o-import">
  <h1 class="a-h1">{{ '@pry.import.title' | i18n }}</h1>
  <div class="o-import__container">
    <div class="o-import__container__input">
      <div class="m-form-label-field">
        <div class="m-form-label-field">
          <label class="a-h3" for="datasets">{{ '@pry.import.fileType' | i18n }}</label>
          <pry-select
            class="a-pry-select"
            id="fileType"
            [items]="fileTypes"
            [itemsAsOption]="true"
            [ngModel]="fileTypes[0].value"
            [disabled]="false"
            (ngModelChange)="onFileTypeChange($event)"
            bindValue="value"
            bindLabel="label"
          ></pry-select>
        </div>
        <label class="a-h3" for="upload_input">
          {{ ('@pry.import.uploadTitle' + selectedFileType | i18n) }}
        </label>
        <div class="o-file-input">
          <div *ngIf="file" class="o-import__container__input__file">
            <pry-icon iconSvg="download"></pry-icon>
            <h3>{{ file.name }}</h3>
            <span>{{ getFileSize(file.size) }}</span>
          </div>
          <pry-upload
            id="upload_input"
            [accept]="fileExtension[selectedFileType]"
            mode="files"
            (uploadedFile)="uploadedChange($event)"
            labelTranslate="@pry.import.selectFile"
          ></pry-upload>
        </div>
      </div>
      <div class="m-form-label-field">
        <label class="a-h3" for="datasets">{{ '@pry.import.datasetImport' | i18n }}</label>
        <pry-select
          class="a-pry-select"
          id="datasets"
          [items]="datasets$ | async"
          [itemsAsOption]="true"
          [(ngModel)]="datasetSelected"
          [placeholder]="'@pry.import.dataset' | i18n"
          bindValue="id"
          bindLabel="name"
        ></pry-select>
      </div>
      <div class="o-import__container__input__actions">
        <button class="a-btn a-btn--primary" (click)="submit()" [disabled]="isSubmitDisabled()">
          {{ '@pry.import.import' | i18n }}
        </button>
      </div>
    </div>
    <ng-container *ngIf="showMessage">
      <div class="o-import__result">
        <h1>
          {{
            '@pry.import.consultDataset'
              | i18n
                : { parameter: datasetSelected ?? '' | translateId : { type: 'datasource', output: 'name' } | async }
          }}
        </h1>
      </div>
    </ng-container>
  </div>
</div>
