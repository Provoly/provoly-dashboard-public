<pry-widget-iframe-css></pry-widget-iframe-css>
<div class="o-widget--iframe">
  <div class="o-widget--iframe__settings">
    <ng-container *ngIf="!(src$ | async)">
      <p>{{ '@pry.widget.iframe.defineSrc' | i18n }}</p>
    </ng-container>
    <pry-settings [widgetIndex]="widgetIndex" (saveTriggered)="emitManifest()" [open$]="open$" class="o-settings">
      <div class="o-settings__fields">
        <div class="m-form-label-field">
          <label class="a-label" for="iframe_src">{{ '@pry.widget.iframe.label' | i18n }}</label>
          <input
            class="a-form-field"
            id="iframe_src"
            type="text"
            [value]="optionsCopy.src"
            (input)="changeSrc($event)"
          />
        </div>
      </div>
    </pry-settings>
  </div>
  <ng-container *ngIf="src$ | async as src">
    <iframe [src]="src" #iframe></iframe>
  </ng-container>
</div>
