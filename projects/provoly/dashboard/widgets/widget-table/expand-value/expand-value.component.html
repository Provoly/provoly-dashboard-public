<div class="a-expandable-value">
  <span class="a-expandable-value__initial">{{ (firstValue | formatNumber).text }}{{ isArray ? ' (*)' : '' }}</span>
  <div class="a-expandable-value__expanded" *ngIf="isArray">
    <div *ngFor="let value of rest">
      {{ (value | formatNumber).text }}
    </div>
  </div>
</div>
