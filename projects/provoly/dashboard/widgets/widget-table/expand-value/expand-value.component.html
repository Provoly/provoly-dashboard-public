<div class="a-expandable-value">
  <span class="a-expandable-value__initial">
    {{ firstValue | dataFormat: field }}
    {{ isArray ? ' (*)' : '' }}
  </span>
  @if (isArray) {
    <div class="a-expandable-value__expanded">
      @for (value of rest; track value) {
        <div>
          {{ value | dataFormat: field }}
        </div>
      }
    </div>
  }
</div>
