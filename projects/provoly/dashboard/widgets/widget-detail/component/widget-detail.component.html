<pry-widget-detail-css></pry-widget-detail-css>
<div class="o-widget o-widget--detail">
  <pry-widget-header
    *ngIf="displayHeader$ | async"
    [widgetIndex]="widgetIndex"
    [manifest]="detailledWidgetManifest$ | async"
    [additionalOptions]="additionalOptions$ | async"
    [headerOptions]="(displayHeader$ | async) ?? {}"
    [displayCount]="false"
  >
  </pry-widget-header>

  <p class="is-empty" *ngIf="!(itemAndCategories$ | async) || (itemAndCategories$ | async)?.length === 0">
    {{ '@pry.widget.detail.noItems' | i18n }}
  </p>

  <div class="o-widget--detail__content" *ngFor="let couple of itemAndCategories$ | async; let itemIndex = index">
    <ng-container *ngIf="!((options$ | async)?.header === false)">
      <div
        class="o-widget--detail__header"
        (contextmenu)="contextMenu($event, couple.item)"
        title="{{ '@pry.widget.itemId' | i18n }}: {{ couple.item.id }}"
      >
        <img [height]="25" [width]="25" [src]="couple.item | translateItemToSymbol | async" [alt]="couple" />
        <h3 class="o-widget--detail__header__title">
          {{ '@pry.widget.class' | i18n }}:
          {{
            couple.item.oClass
              | translateId
                : {
                    type: 'class',
                    output: 'name'
                  }
              | async
          }}
        </h3>
        <button
          type="button"
          class="a-btn a-btn--icon-only"
          [attr.aria-expanded]="!(!!panelOpened[itemIndex] && panelOpened[itemIndex].item)"
          [attr.aria-controls]="'item-' + widgetId + '-' + itemIndex"
          (click)="toggle(itemIndex)"
        >
          <pry-icon *ngIf="!!panelOpened[itemIndex] && panelOpened[itemIndex].item" iconSvg="fleche_haut"></pry-icon>
          <pry-icon *ngIf="!(!!panelOpened[itemIndex] && panelOpened[itemIndex].item)" iconSvg="fleche_bas"></pry-icon>
        </button>
      </div>
      <div class="o-widget--detail__datas" *ngIf="hasMetadata(couple.item)">
        <pry-metadata [item]="couple.item"></pry-metadata>
      </div>
    </ng-container>

    <div
      *ngIf="!!panelOpened[itemIndex] && panelOpened[itemIndex].item"
      (contextmenu)="contextMenu($event, couple.item)"
      class="o-widget--detail__datas"
      [id]="'item-' + widgetId + '-' + itemIndex"
    >
      <ng-container *ngFor="let category of couple.categories; let categoryIndex = index">
        <div class="o-widget--detail__category">
          <p>{{ '@pry.widget.detail.category' | i18n }}: {{ category.name }}</p>
          <button
            type="button"
            class="a-btn a-btn--icon-only"
            [attr.aria-expanded]="!(panelOpened[itemIndex] && panelOpened[itemIndex].categories[categoryIndex])"
            [attr.aria-controls]="'properties-' + widgetId + '-' + itemIndex + '-' + categoryIndex"
            (click)="toggle(itemIndex, categoryIndex)"
          >
            <pry-icon
              *ngIf="panelOpened[itemIndex] && panelOpened[itemIndex].categories[categoryIndex]"
              iconSvg="fleche_haut"
            >
            </pry-icon>
            <pry-icon
              *ngIf="!(panelOpened[itemIndex] && panelOpened[itemIndex].categories[categoryIndex])"
              iconSvg="fleche_bas"
            >
            </pry-icon>
          </button>
        </div>

        <div
          class="o-properties"
          [id]="'properties-' + widgetId + '-' + itemIndex + '-' + categoryIndex"
          *ngIf="panelOpened[itemIndex] && panelOpened[itemIndex].categories[categoryIndex]"
        >
          <ul class="o-properties__list">
            <ng-container>
              <ng-container *ngFor="let property of category.properties">
                <li
                  *ngFor="let value of getValue(couple.item, property.attribute); let i = index; let c = count"
                  class="o-properties__list__item"
                >
                  <p class="o-properties__list__item__label" *ngIf="i === 0">{{ property.name }}:</p>
                  <p class="o-properties__list__item__value" *ngIf="!isRaw(property)">{{ value?.value }}</p>
                  <p class="o-properties__list__item__raw" *ngIf="isRaw(property)">
                    <pry-vizualize-raw [item]="couple.item" [propertyName]="property.name"></pry-vizualize-raw>
                  </p>
                  <ng-container *ngIf="hasMetadata(value)">
                    <pry-metadata [item]="value"></pry-metadata>
                  </ng-container>
                </li>
              </ng-container>
            </ng-container>
          </ul>
        </div>
      </ng-container>
    </div>
  </div>
</div>
