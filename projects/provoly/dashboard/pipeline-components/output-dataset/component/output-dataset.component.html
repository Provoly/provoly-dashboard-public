<div class="m-form-label-field">
  <label class="a-label" for="dataset">{{ '@pry.pipeline.dataset.output' | i18n }}</label>
  <pry-select
    [items]="datasets$ | async"
    [ngModel]="node.properties['dataset']"
    (ngModelChange)="change($event)"
    [disabled]="disabled"
    bindLabel="name"
    bindValue="id"
    id="dataset"
  ></pry-select>
</div>
