<div class="m-form-label-field">
  <label class="a-label" for="dataset">{{ '@pry.pipeline.dataset.input' | i18n }}</label>
  <pry-select
    [items]="dataSources$ | async"
    [ngModel]="node.properties['datasetId']"
    (ngModelChange)="change($event)"
    [disabled]="disabled"
    bindLabel="name"
    bindValue="id"
    id="dataset"
  ></pry-select>
</div>
